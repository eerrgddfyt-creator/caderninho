}

  --green: #3fb27a; --green-d: #7fdcae; --green-soft: #173528; --gold-soft: #3a2f10; --gold-d: #f2c75a;
  --red: #ff7d74; --red-soft: #3d1d1b; --blue: #7db4f0; --blue-soft: #172a42;
  --paper: #121a16; --paper-2: #1b2620; --card: #19231e; --ink: #eaf1ec; --ink-2: #a2b2a8; --line: #2b3a32;
  --shadow-sm: 0 1px 2px rgba(0,0,0,.4); --shadow: 0 6px 20px rgba(0,0,0,.45); --shadow-lg: 0 18px 50px rgba(0,0,0,.6);
  --on-green: #07210f; color-scheme: dark;
}

* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html { font-size: clamp(13.5px, 3.85vw, 16.5px); -webkit-text-size-adjust: 100%; scroll-behavior: smooth; }
body {
  margin: 0; background: var(--paper); color: var(--ink); min-height: 100vh; min-height: 100dvh;
  font: var(--fs-body)/1.45 system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
  -webkit-font-smoothing: antialiased; overflow-x: hidden;
}
body.sheet-open { overflow: hidden; }
h1, h2, h3, p { margin: 0; }
button { font: inherit; color: inherit; cursor: pointer; }
a { color: inherit; }
[hidden] { display: none !important; }
.ic { width: 1.15em; height: 1.15em; flex: none; vertical-align: -.2em; }
:focus-visible { outline: 3px solid var(--blue); outline-offset: 2px; border-radius: .4rem; }
.sr-only { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
.muted { color: var(--ink-2); }
.neg { color: var(--red); } .pos { color: var(--green); }
.num { font-variant-numeric: tabular-nums; }
body.hide-values .money { filter: blur(.45rem); user-select: none; }

/* ---------- Estrutura ---------- */
.app-header {
  position: sticky; top: 0; z-index: 30; display: flex; align-items: center; gap: .6rem;
  padding: calc(.55rem + env(safe-area-inset-top)) max(1rem, env(safe-area-inset-right)) .55rem max(1rem, env(safe-area-inset-left));
  background: color-mix(in srgb, var(--paper) 88%, transparent); backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px);
  border-bottom: 1px solid var(--line);
}
.brand { display: flex; align-items: center; gap: .55rem; font-weight: 800; letter-spacing: -.02em; font-size: 1.12rem; text-decoration: none; margin-right: auto; }
.brand img { width: 2rem; height: 2rem; border-radius: .5rem; display: block; }
.chip { display: inline-flex; align-items: center; gap: .3rem; min-height: 2.2rem; padding: .25rem .65rem; border-radius: 999px; background: var(--gold-soft); color: var(--gold-d); font-weight: 800; border: 0; text-decoration: none; }
.chip.off { background: var(--paper-2); color: var(--ink-2); }
.chip-net { display: inline-flex; align-items: center; gap: .3rem; padding: .3rem .6rem; border-radius: 999px; font-size: var(--fs-small); font-weight: 700; white-space: nowrap; border: 0; }
.chip-net.off { background: var(--gold-soft); color: var(--gold-d); }
.chip-net.busy { background: var(--blue-soft); color: var(--blue); }
.chip-net.busy .ic { animation: spin 1s linear infinite; }
.chip-net.err { background: var(--red-soft); color: var(--red); }
@keyframes spin { to { transform: rotate(360deg); } }
.avatar { width: 2.4rem; height: 2.4rem; border-radius: 50%; background: var(--green); color: var(--on-green); font-weight: 800; display: grid; place-items: center; border: 0; text-decoration: none; }
.avatar .ic { width: 1.2rem; height: 1.2rem; }

main#view {
  max-width: 34rem; margin: 0 auto; display: grid; gap: .95rem; align-content: start;
  padding: 1rem max(1rem, env(safe-area-inset-right)) calc(var(--tabbar-h) + 2.2rem + env(safe-area-inset-bottom)) max(1rem, env(safe-area-inset-left));
  animation: rise .25s ease-out;
}
@keyframes rise { from { opacity: 0; transform: translateY(.5rem); } to { opacity: 1; transform: none; } }

.tabbar {
  position: fixed; z-index: 40; left: 0; right: 0; bottom: 0; height: calc(var(--tabbar-h) + env(safe-area-inset-bottom));
  padding-bottom: env(safe-area-inset-bottom); display: grid; grid-template-columns: repeat(5, 1fr); align-items: center;
  background: var(--card); border-top: 1px solid var(--line); box-shadow: 0 -4px 18px rgba(0,0,0,.06);
}
.tabbar-inner { display: contents; }
.tabbar a.tab { display: grid; justify-items: center; gap: .15rem; text-decoration: none; color: var(--ink-2); font-size: var(--fs-tiny); font-weight: 700; padding: .35rem 0; min-height: 3.3rem; align-content: center; }
.tabbar a.tab .ic { width: 1.55rem; height: 1.55rem; }
.tabbar a.tab.active { color: var(--green); }
.tabbar a.tab.active .ic { stroke-width: 2.4; }
.fab {
  position: fixed; z-index: 41; right: max(1rem, env(safe-area-inset-right)); bottom: calc(var(--tabbar-h) + 1rem + env(safe-area-inset-bottom));
  width: 3.7rem; height: 3.7rem; border-radius: 50%; border: 0; background: var(--gold); color: #3a2800;
  display: grid; place-items: center; box-shadow: 0 8px 22px rgba(0,0,0,.28);
}
.fab .ic { width: 1.8rem; height: 1.8rem; stroke-width: 2.8; }
.fab:active { transform: scale(.94); }
@media (min-width: 700px) { .fab { right: calc(50% - 17rem + 1rem); } }
@media (min-width: 700px) { .tabbar { left: 50%; right: auto; width: 34rem; transform: translateX(-50%); border-radius: 1.2rem 1.2rem 0 0; border: 1px solid var(--line); border-bottom: 0; } }

.page-title { font-size: var(--fs-title); font-weight: 800; letter-spacing: -.03em; line-height: 1.15; }
.page-sub { color: var(--ink-2); margin-top: .2rem; }
.section-title { font-size: var(--fs-h2); font-weight: 800; display: flex; align-items: center; gap: .4rem; margin-top: .3rem; }

/* ---------- Cartões e listas ---------- */
.card { background: var(--card); border: 1px solid var(--line); border-radius: var(--radius); padding: 1rem; box-shadow: var(--shadow-sm); display: grid; gap: .7rem; }
.card-title { display: flex; align-items: center; justify-content: space-between; gap: .5rem; }
.card-title h2 { font-size: var(--fs-h2); font-weight: 800; display: flex; align-items: center; gap: .4rem; }
.link { color: var(--green); font-weight: 700; background: none; border: 0; padding: .3rem 0; text-decoration: none; font-size: var(--fs-small); }
.link:hover { text-decoration: underline; }
.hint { font-size: var(--fs-small); color: var(--ink-2); }
hr.soft { border: 0; border-top: 1px solid var(--line); margin: 0; }
.list { display: grid; }
.row {
  display: flex; align-items: center; gap: .75rem; padding: .7rem 0; width: 100%; min-height: 3.4rem; text-align: left;
  background: none; border: 0; border-bottom: 1px solid var(--line); text-decoration: none; color: inherit;
}
.list > .row:last-child, .row:last-child { border-bottom: 0; }
.row-ico { width: 2.5rem; height: 2.5rem; border-radius: .8rem; display: grid; place-items: center; background: var(--paper-2); color: var(--ink-2); flex: none; }
.row-ico.in { background: var(--green-soft); color: var(--green); }
.row-ico.out { background: var(--red-soft); color: var(--red); }
.row-ico.late { background: var(--red-soft); color: var(--red); }
.row-ico.meta { background: var(--blue-soft); color: var(--blue); }
.row-main { display: grid; min-width: 0; flex: 1; }
.row-main b { font-weight: 700; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.row-main small { color: var(--ink-2); font-size: var(--fs-small); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.row-main small.late { color: var(--red); font-weight: 700; }
.amount { font-weight: 800; font-variant-numeric: tabular-nums; white-space: nowrap; }
.amount.in { color: var(--green); } .amount.out { color: var(--ink); } .amount.meta { color: var(--blue); }
.tag { display: inline-block; font-size: var(--fs-tiny); font-weight: 700; background: var(--blue-soft); color: var(--blue); padding: .05rem .45rem; border-radius: 999px; vertical-align: .1rem; }
.day-head { display: flex; justify-content: space-between; font-size: var(--fs-small); font-weight: 800; color: var(--ink-2); padding: .5rem 0 .1rem; text-transform: capitalize; }

/* ---------- Saldo ---------- */
.balance { background: linear-gradient(160deg, #1f7a4d 0%, #145233 100%); color: #fff; border: 0; position: relative; overflow: hidden; }
.balance::after { content: ""; position: absolute; right: -3rem; top: -3rem; width: 11rem; height: 11rem; border-radius: 50%; background: rgba(255,255,255,.07); }
.balance .eyebrow { font-size: var(--fs-small); opacity: .85; font-weight: 600; display: flex; align-items: center; justify-content: space-between; }
.balance .big { font-size: var(--fs-big); font-weight: 800; letter-spacing: -.04em; line-height: 1.1; font-variant-numeric: tabular-nums; }
.balance .big.neg { color: #ffd1cc; }
.balance .split { display: grid; grid-template-columns: 1fr 1fr; gap: .6rem; }
.balance .split > div { background: rgba(255,255,255,.12); border-radius: .8rem; padding: .55rem .75rem; display: grid; }
.balance .split small { opacity: .85; font-size: var(--fs-small); }
.balance .split b { font-size: 1.1rem; font-variant-numeric: tabular-nums; }
.balance .saved-note { font-size: var(--fs-small); opacity: .9; display: flex; gap: .35rem; align-items: center; }
.balance .quick { display: grid; grid-template-columns: 1fr 1fr; gap: .6rem; position: relative; z-index: 1; }
.eye-btn { background: rgba(255,255,255,.15); color: #fff; border: 0; border-radius: 999px; width: 2.2rem; height: 2.2rem; display: grid; place-items: center; position: relative; z-index: 1; }

/* ---------- Botões ---------- */
.btn {
  display: inline-flex; align-items: center; justify-content: center; gap: .45rem; min-height: var(--tap); padding: .55rem 1.1rem;
  border-radius: .95rem; border: 1.5px solid var(--line); background: var(--card); font-weight: 800; text-decoration: none; transition: transform .08s, filter .15s;
}
.btn:active { transform: scale(.97); }
.btn:disabled, .btn[disabled] { opacity: .55; cursor: not-allowed; }
.btn.primary { background: var(--green); border-color: var(--green); color: var(--on-green); }
.btn.ghost { background: transparent; border-color: var(--green); color: var(--green); }
.btn.wa { background: var(--wa); border-color: var(--wa); color: #fff; }
.btn.danger-ghost { background: transparent; border-color: transparent; color: var(--red); }
.btn.danger { background: var(--red); border-color: var(--red); color: #fff; }
.btn.small { min-height: 2.75rem; padding: .35rem .8rem; font-size: var(--fs-small); border-radius: .8rem; }
.btn.block { width: 100%; }
.btn.grow { flex: 1; }
.btn.b-in { background: #fff; color: #145233; border-color: #fff; font-size: 1.08rem; min-height: 3.3rem; }
.quick .btn:not(.b-in) { background: rgba(0,0,0,.22); color: #fff; border-color: transparent; font-size: 1.08rem; min-height: 3.3rem; }
.icon-btn { width: 2.75rem; height: 2.75rem; border-radius: 50%; border: 0; background: var(--paper-2); display: grid; place-items: center; }
.two-up { display: grid; grid-template-columns: 1fr 1fr; gap: .6rem; }
.stat { background: var(--card); border: 1px solid var(--line); border-radius: var(--radius); padding: .8rem; display: grid; gap: .1rem; box-shadow: var(--shadow-sm); }
.stat small { color: var(--ink-2); font-size: var(--fs-small); }
.stat b { font-size: 1.2rem; font-variant-numeric: tabular-nums; }

/* ---------- Progresso, ajuda ---------- */
.bar { height: .7rem; background: var(--paper-2); border-radius: 999px; overflow: hidden; }
.bar > i { display: block; height: 100%; width: 0; background: var(--gold); border-radius: 999px; transition: width .5s ease; }
.bar.green > i { background: var(--green); } .bar.red > i { background: var(--red); }
.streak-line { display: flex; gap: .8rem; align-items: center; }
.streak-line p { color: var(--ink-2); font-size: var(--fs-small); }
.streak-flame { width: 2.8rem; height: 2.8rem; border-radius: 50%; background: var(--gold-soft); color: var(--gold-d); display: grid; place-items: center; }
.streak-flame .ic { width: 1.5rem; height: 1.5rem; }
.lvl-head { display: flex; justify-content: space-between; align-items: baseline; }
.lvl-head small { color: var(--ink-2); }
.help { display: flex; gap: .55rem; padding: .6rem .75rem; border-radius: var(--radius-sm); background: var(--blue-soft); color: var(--ink); font-size: var(--fs-small); line-height: 1.4; }
.help .ic { color: var(--blue); margin-top: .1rem; }
.help b { font-weight: 800; }
.help .h-title { display: block; font-weight: 800; margin-bottom: .1rem; }
.help.tip { background: var(--gold-soft); } .help.tip .ic { color: var(--gold-d); }
.help.warn { background: var(--red-soft); } .help.warn .ic { color: var(--red); }
.help.ok { background: var(--green-soft); } .help.ok .ic { color: var(--green); }
body.no-help .help:not(.force) { display: none; }
.empty { display: grid; justify-items: center; text-align: center; gap: .4rem; padding: 1rem .5rem; }
.empty > .ic { width: 2.6rem; height: 2.6rem; color: var(--ink-2); opacity: .6; }
.empty b { font-size: 1.05rem; } .empty p { color: var(--ink-2); font-size: var(--fs-small); max-width: 22rem; }
.empty .btn { margin-top: .4rem; }

/* ---------- Filtros / chips / formulários ---------- */
.filters { display: flex; gap: .45rem; overflow-x: auto; padding: .1rem 0 .3rem; scrollbar-width: none; }
.filters::-webkit-scrollbar { display: none; }
.pill { flex: none; min-height: 2.5rem; padding: .3rem .85rem; border-radius: 999px; border: 1.5px solid var(--line); background: var(--card); font-weight: 700; font-size: var(--fs-small); display: inline-flex; gap: .3rem; align-items: center; }
.pill.active { background: var(--green); border-color: var(--green); color: var(--on-green); }
.search { display: flex; align-items: center; gap: .5rem; background: var(--card); border: 1.5px solid var(--line); border-radius: .95rem; padding: 0 .8rem; min-height: 2.9rem; }
.search input { flex: 1; border: 0; background: transparent; font: inherit; color: inherit; min-height: 2.8rem; min-width: 0; }
.search input:focus { outline: none; }
.search:focus-within { border-color: var(--green); }
.form { display: grid; gap: .85rem; }
.field { display: grid; gap: .3rem; }
.field > span { font-weight: 700; font-size: var(--fs-small); }
.field em { font-style: normal; font-weight: 500; color: var(--ink-2); }
.field input, .field select, .field textarea {
  width: 100%; min-height: var(--tap); padding: .55rem .85rem; border-radius: .85rem; border: 1.5px solid var(--line);
  background: var(--card); color: var(--ink); font: inherit; font-size: max(1rem, 16px);
}
.field input:focus, .field select:focus, .field textarea:focus { border-color: var(--green); outline: none; box-shadow: 0 0 0 3px var(--green-soft); }
.field.bad input { border-color: var(--red); }
.field .err { color: var(--red); font-size: var(--fs-small); font-weight: 600; }
.money-input { display: flex; align-items: center; gap: .5rem; border: 1.5px solid var(--line); border-radius: .95rem; padding: 0 .9rem; background: var(--card); min-height: 3.4rem; }
.money-input:focus-within { border-color: var(--green); box-shadow: 0 0 0 3px var(--green-soft); }
.money-input b { color: var(--ink-2); font-size: 1.1rem; }
.money-input input { border: 0; background: transparent; font-size: max(1.6rem, 16px); font-weight: 800; padding: 0; min-height: 3.2rem; box-shadow: none !important; flex: 1; min-width: 0; letter-spacing: -.02em; }
.money-input input:focus { outline: none; }
.seg { display: grid; grid-auto-flow: column; grid-auto-columns: 1fr; background: var(--paper-2); border-radius: .95rem; padding: .25rem; gap: .25rem; }
.seg-btn { min-height: 2.7rem; border: 0; background: transparent; border-radius: .75rem; font-weight: 800; display: inline-flex; justify-content: center; align-items: center; gap: .35rem; color: var(--ink-2); }
.seg-btn.active { background: var(--card); color: var(--ink); box-shadow: var(--shadow-sm); }
.chips { display: flex; flex-wrap: wrap; gap: .4rem; }
.chip-b { display: inline-flex; align-items: center; gap: .35rem; min-height: 2.5rem; padding: .25rem .75rem; border-radius: 999px; border: 1.5px solid var(--line); background: var(--card); font-size: var(--fs-small); font-weight: 700; }
.chip-b.active { background: var(--green-soft); border-color: var(--green); color: var(--green-d); }
.check { display: flex; align-items: center; gap: .6rem; min-height: var(--tap); font-weight: 600; }
.check input { width: 1.4rem; height: 1.4rem; accent-color: var(--green); }
.actions { display: flex; gap: .6rem; align-items: center; margin-top: .2rem; }
.form-msg { padding: .6rem .8rem; border-radius: var(--radius-sm); font-size: var(--fs-small); line-height: 1.4; background: var(--paper-2); }
.form-msg.ok { background: var(--green-soft); color: var(--green-d); }
.form-msg.bad { background: var(--red-soft); color: var(--red); font-weight: 600; }
.quick-amounts { display: flex; gap: .4rem; flex-wrap: wrap; }

/* ---------- Contas ---------- */
.bill-card { gap: .6rem; }
.bill-top { display: flex; align-items: center; gap: .75rem; background: none; border: 0; padding: 0; text-align: left; width: 100%; min-height: 3rem; }
.bill-actions { display: flex; gap: .5rem; flex-wrap: wrap; }

/* ---------- Metas ---------- */
.goal-head { display: flex; justify-content: space-between; align-items: center; gap: .5rem; }
.goal-head b { display: flex; align-items: center; gap: .4rem; }
.goal-meta { display: flex; justify-content: space-between; font-size: var(--fs-small); color: var(--ink-2); gap: .5rem; }

/* ---------- Resumo ---------- */
.month-nav { display: flex; align-items: center; justify-content: space-between; gap: .5rem; }
.month-nav b { font-size: 1.05rem; text-align: center; flex: 1; }
.bars { display: grid; grid-template-columns: repeat(6, 1fr); gap: .5rem; align-items: end; height: 8.5rem; padding-top: .5rem; }
.bars .col { display: grid; grid-template-rows: 1fr auto; height: 100%; gap: .3rem; justify-items: center; }
.bars .pair { display: flex; gap: 2px; align-items: flex-end; height: 100%; width: 100%; justify-content: center; }
.bars .pair i { display: block; width: 38%; max-width: 1.2rem; border-radius: .3rem .3rem 0 0; min-height: 2px; }
.bars .pair .i { background: var(--green); } .bars .pair .o { background: var(--gold); }
.bars small { font-size: var(--fs-tiny); color: var(--ink-2); text-transform: capitalize; }
.bars .col.now small { color: var(--ink); font-weight: 800; }
.legend { display: flex; gap: 1rem; font-size: var(--fs-small); color: var(--ink-2); }
.legend i { display: inline-block; width: .7rem; height: .7rem; border-radius: .2rem; margin-right: .3rem; }
.cat-row { display: grid; gap: .25rem; }
.cat-row .top { display: flex; justify-content: space-between; gap: .5rem; font-size: var(--fs-small); }
.cat-row .top span { display: inline-flex; gap: .35rem; align-items: center; font-weight: 700; }
.ach-grid { display: grid; grid-template-columns: 1fr 1fr; gap: .5rem; }
.ach { display: grid; gap: .15rem; justify-items: center; text-align: center; padding: .75rem .5rem; border-radius: var(--radius-sm); background: var(--gold-soft); border: 1px solid var(--line); }
.ach .ic { width: 1.7rem; height: 1.7rem; color: var(--gold-d); }
.ach b { font-size: var(--fs-small); } .ach small { font-size: var(--fs-tiny); color: var(--ink-2); }
.ach.locked { background: var(--paper-2); opacity: .65; } .ach.locked .ic { color: var(--ink-2); }

/* ---------- Pix ---------- */
.pix-box { display: grid; justify-items: center; gap: .45rem; text-align: center; }
.qr-wrap { width: min(100%, 15.5rem); padding: .55rem; background: #fff; border: 1px solid var(--line); border-radius: var(--radius-sm); box-shadow: var(--shadow-sm); }
.qr-wrap .qr { display: block; width: 100%; height: auto; }
.pix-amount { font-size: 1.7rem; font-weight: 800; letter-spacing: -.02em; font-variant-numeric: tabular-nums; }
.pix-code { width: 100%; min-height: 5.5rem; padding: .6rem .75rem; resize: none; border: 1.5px solid var(--line); border-radius: .85rem; background: var(--card); color: var(--ink); font: .72rem/1.4 ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; word-break: break-all; }
.pix-steps { display: grid; gap: .4rem; font-size: var(--fs-small); }
.pix-steps div { display: flex; gap: .55rem; align-items: flex-start; }
.pix-steps b.n { flex: none; width: 1.5rem; height: 1.5rem; border-radius: 50%; background: var(--green); color: var(--on-green); display: grid; place-items: center; font-size: var(--fs-tiny); }
.verified { display: inline-flex; align-items: center; gap: .35rem; font-size: var(--fs-small); color: var(--green); font-weight: 700; }

/* ---------- Sheet, diálogo, toast ---------- */
.overlay { position: fixed; inset: 0; z-index: 100; background: rgba(10,20,15,.55); display: flex; align-items: flex-end; justify-content: center; animation: fade .2s; }
@keyframes fade { from { opacity: 0; } }
.sheet {
  width: 100%; max-width: 34rem; max-height: 92dvh; max-height: 92vh; background: var(--paper); border-radius: 1.4rem 1.4rem 0 0; display: flex; flex-direction: column;
  animation: slide .25s cubic-bezier(.2,.8,.2,1); box-shadow: var(--shadow-lg);
}
@supports (height: 1dvh) { .sheet { max-height: 92dvh; } }
@keyframes slide { from { transform: translateY(100%); } }
.sheet-head { display: flex; align-items: center; justify-content: space-between; gap: .5rem; padding: .9rem 1rem .6rem 1.2rem; position: relative; }
.sheet-head::before { content: ""; position: absolute; top: .35rem; left: 50%; width: 2.5rem; height: .28rem; border-radius: 99px; background: var(--line); transform: translateX(-50%); }
.sheet-head h2 { font-size: 1.2rem; font-weight: 800; }
.sheet-body { padding: .3rem 1.2rem calc(1.4rem + env(safe-area-inset-bottom)); overflow-y: auto; overscroll-behavior: contain; display: grid; gap: .85rem; align-content: start; }
@media (min-width: 700px) { .overlay { align-items: center; } .sheet { border-radius: 1.4rem; } }
.dialog { background: var(--card); border-radius: 1.3rem; padding: 1.3rem; width: min(92vw, 24rem); display: grid; gap: .8rem; box-shadow: var(--shadow-lg); margin: auto; animation: rise .2s; }
.dialog h2 { font-size: 1.2rem; } .dialog p { color: var(--ink-2); }
.overlay.center { align-items: center; }
.toasts { position: fixed; z-index: 200; left: 50%; transform: translateX(-50%); bottom: calc(var(--tabbar-h) + 1.4rem + env(safe-area-inset-bottom)); display: grid; gap: .5rem; width: min(92vw, 26rem); pointer-events: none; }
.toast { background: var(--ink); color: var(--paper); padding: .7rem 1rem; border-radius: .95rem; font-weight: 600; font-size: var(--fs-small); box-shadow: var(--shadow); display: flex; align-items: center; gap: .6rem; animation: rise .2s; pointer-events: auto; }
.toast.success { background: var(--green-d); color: #fff; } .toast.error { background: var(--red); color: #fff; } .toast.gold { background: var(--gold); color: #3a2800; }
:root[data-theme="dark"] .toast.success, :root:not([data-theme="light"]) .toast.success { color: #0c2418; }
.toast button { margin-left: auto; background: rgba(255,255,255,.2); color: inherit; border: 0; border-radius: .6rem; padding: .35rem .7rem; font-weight: 800; min-height: 2.2rem; }
.banner { display: flex; align-items: center; gap: .6rem; padding: .7rem .9rem; border-radius: var(--radius-sm); font-size: var(--fs-small); font-weight: 600; }
.banner.warn { background: var(--gold-soft); color: var(--gold-d); } .banner.bad { background: var(--red-soft); color: var(--red); } .banner.ok { background: var(--green-soft); color: var(--green-d); }
.banner .btn { margin-left: auto; flex: none; }
.settings-row { display: flex; align-items: center; gap: .75rem; padding: .6rem 0; border-bottom: 1px solid var(--line); min-height: 3.2rem; }
.settings-row:last-child { border-bottom: 0; }
.settings-row > .ic { color: var(--ink-2); width: 1.4rem; height: 1.4rem; }
.settings-row .grow { flex: 1; display: grid; min-width: 0; } .settings-row .grow small { color: var(--ink-2); font-size: var(--fs-small); }
.switch { appearance: none; width: 3rem; height: 1.75rem; border-radius: 99px; background: var(--line); position: relative; border: 0; transition: background .2s; flex: none; }
.switch::after { content: ""; position: absolute; top: .2rem; left: .2rem; width: 1.35rem; height: 1.35rem; border-radius: 50%; background: #fff; transition: transform .2s; box-shadow: 0 1px 3px rgba(0,0,0,.3); }
.switch:checked { background: var(--green); } .switch:checked::after { transform: translateX(1.25rem); }

/* ---------- Abertura ---------- */
.splash { position: fixed; inset: 0; z-index: 500; background: var(--green); color: #fff; display: grid; place-items: center; align-content: center; gap: 1rem; transition: opacity .45s, visibility .45s; }
.splash.leave { opacity: 0; visibility: hidden; }
.splash svg.logo { width: 9rem; height: 9rem; }
.splash .name { font-size: 2rem; font-weight: 800; letter-spacing: -.03em; opacity: 0; animation: fadeup .6s 1.5s forwards; }
.splash .by { position: absolute; bottom: calc(2rem + env(safe-area-inset-bottom)); font-size: var(--fs-small); opacity: 0; animation: fadeup .6s 2s forwards; letter-spacing: .05em; }
.splash .skip { position: absolute; top: calc(1rem + env(safe-area-inset-top)); right: 1rem; background: rgba(255,255,255,.18); color: #fff; border: 0; border-radius: 99px; padding: .45rem .9rem; font-weight: 700; font-size: var(--fs-small); }
@keyframes fadeup { from { opacity: 0; transform: translateY(.6rem); } to { opacity: 1; transform: none; } }
.splash .draw { stroke-dasharray: 220; stroke-dashoffset: 220; animation: draw 1s ease-out forwards; }
.splash .d1 { animation-delay: .2s; } .splash .d2 { animation-delay: .5s; } .splash .d3 { animation-delay: .9s; } .splash .d4 { animation-delay: 1.2s; }
.splash .pop { transform-origin: center; animation: pop .6s cubic-bezier(.2,1.4,.4,1) both; }
@keyframes draw { to { stroke-dashoffset: 0; } }
@keyframes pop { from { transform: scale(.6); opacity: 0; } }
@media (prefers-reduced-motion: reduce) { .splash *, main#view, .sheet, .overlay, .toast { animation-duration: .01s !important; animation-delay: 0s !important; } .splash .name, .splash .by { opacity: 1; } .splash .draw { stroke-dashoffset: 0; } }

@media print {
  .app-header, .tabbar, .toasts, .btn, .fab { display: none !important; }
  body { background: #fff; color: #000; }
  main#view { padding: 0; max-width: none; }
  .card { box-shadow: none; break-inside: avoid; }
}

/* ==========================================================================
   Arte — Tim v2 e ilustrações (módulo 13-art.js)
   ========================================================================== */
:root { --art-blob: #e3f2ea; --art-blob-2: #fdf1d3; --art-ink: #1d2a24; }
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) { --art-blob: #1a3a2b; --art-blob-2: #3a2f10; } }
:root[data-theme="dark"] { --art-blob: #1a3a2b; --art-blob-2: #3a2f10; }

svg.tim { display: block; overflow: visible; width: 6rem; height: 6.6rem; flex: none; --px: 0px; --py: 0px; }
svg.tim .t-all { transform-box: view-box; transform-origin: 100px 200px; }
svg.tim .t-pup { transform: translate(calc(var(--px) + var(--ox, 0px)), calc(var(--py) + var(--oy, 0px))); transition: transform .22s cubic-bezier(.2,.9,.3,1); }
svg.tim .t-eye { transform-box: fill-box; transform-origin: center; animation: tBlink 5s infinite; }
svg.tim .t-eye:nth-of-type(2) { animation-delay: .02s; }
@keyframes tBlink { 0%, 92%, 100% { transform: scaleY(1); } 95.5% { transform: scaleY(.08); } }
svg.tim .t-sprout { transform-box: view-box; transform-origin: 100px 40px; animation: tSprout 3.4s ease-in-out infinite; }
@keyframes tSprout { 0%, 100% { transform: rotate(-5deg); } 50% { transform: rotate(6deg); } }
svg.tim .t-hat { transform-box: view-box; transform-origin: 108px 44px; animation: tSprout 2.6s ease-in-out infinite; }
svg.tim .t-arm-wave { transform-box: view-box; transform-origin: 158px 108px; animation: tWaveArm 1.1s ease-in-out infinite; }
@keyframes tWaveArm { 0%, 100% { transform: rotate(-9deg); } 50% { transform: rotate(14deg); } }
svg.tim .t-z text { animation: tZ 2.4s ease-in-out infinite; transform-box: fill-box; transform-origin: center; }
svg.tim .t-z text:nth-child(2) { animation-delay: .6s; }
@keyframes tZ { 0%, 100% { opacity: .2; transform: translateY(4px) scale(.8); } 50% { opacity: 1; transform: translateY(-4px) scale(1.1); } }
svg.tim .t-conf > * { animation: tConf 1.8s ease-in-out infinite; transform-box: fill-box; transform-origin: center; }
svg.tim .t-conf > *:nth-child(2) { animation-delay: .3s; } svg.tim .t-conf > *:nth-child(3) { animation-delay: .6s; } svg.tim .t-conf > *:nth-child(4) { animation-delay: .9s; }
@keyframes tConf { 0%, 100% { transform: translateY(0) rotate(0); opacity: 1; } 50% { transform: translateY(8px) rotate(90deg); opacity: .5; } }
svg.tim .t-heart { transform-box: fill-box; transform-origin: center; animation: tHeart 1.2s ease-in-out infinite; }
@keyframes tHeart { 0%, 100% { transform: scale(1) translateY(0); opacity: 1; } 50% { transform: scale(1.25) translateY(-6px); opacity: .7; } }

/* movimentos do corpo todo */
.t-bounce .t-all { animation: tBounce 1.7s ease-in-out infinite; }
@keyframes tBounce { 0%, 100% { transform: translateY(0) scale(1, 1); } 12% { transform: translateY(0) scale(1.07, .91); } 40% { transform: translateY(-14px) scale(.96, 1.05); } 62% { transform: translateY(-14px) scale(.97, 1.04); } 86% { transform: translateY(0) scale(1.06, .93); } }
.t-bounce .t-shadow { animation: tShadow 1.7s ease-in-out infinite; transform-box: fill-box; transform-origin: center; }
@keyframes tShadow { 0%, 100% { transform: scale(1); opacity: .22; } 40%, 62% { transform: scale(.7); opacity: .12; } }
.t-float .t-all { animation: tFloat 3.4s ease-in-out infinite; }
@keyframes tFloat { 0%, 100% { transform: translateY(0) rotate(-2deg); } 50% { transform: translateY(-8px) rotate(2deg); } }
.t-wiggle .t-all { animation: tWiggle 2.6s ease-in-out infinite; }
@keyframes tWiggle { 0%, 100% { transform: rotate(0); } 8% { transform: rotate(-7deg); } 16% { transform: rotate(6deg); } 24% { transform: rotate(-4deg); } 32% { transform: rotate(0); } }
.t-sway .t-all { animation: tSway 2.8s ease-in-out infinite; }
@keyframes tSway { 0%, 100% { transform: rotate(-4deg); } 50% { transform: rotate(4deg); } }
.t-spin .t-all { animation: tSpin 4s ease-in-out infinite; }
@keyframes tSpin { 0%, 62%, 100% { transform: rotateY(0); } 82% { transform: rotateY(360deg); } }
.t-pop .t-all { animation: tPop .7s cubic-bezier(.2,1.6,.4,1) both; }
@keyframes tPop { 0% { transform: scale(.2) translateY(30px); opacity: 0; } 100% { transform: none; opacity: 1; } }
.t-jump .t-all { animation: tJump .9s cubic-bezier(.3,1.3,.5,1) 1; }
@keyframes tJump { 0% { transform: translateY(0) scale(1.08, .9); } 40% { transform: translateY(-22px) scale(.95, 1.06); } 100% { transform: none; } }

/* ---- Ilustrações ---- */
svg.scene { display: block; width: 100%; height: auto; overflow: visible; }
.scene .blob { fill: var(--art-blob); }
.scene .blob2 { fill: var(--art-blob-2); }
.scene .a-float { animation: aFloat 3.6s ease-in-out infinite; transform-box: fill-box; transform-origin: center; }
.scene .a-float.d1 { animation-delay: -1.2s; } .scene .a-float.d2 { animation-delay: -2.4s; }
@keyframes aFloat { 0%, 100% { transform: translateY(0) rotate(-3deg); } 50% { transform: translateY(-6px) rotate(3deg); } }
.scene .a-twinkle { animation: aTwinkle 2.4s ease-in-out infinite; transform-box: fill-box; transform-origin: center; }
.scene .a-twinkle.d1 { animation-delay: -.8s; } .scene .a-twinkle.d2 { animation-delay: -1.6s; }
@keyframes aTwinkle { 0%, 100% { transform: scale(.3) rotate(0); opacity: .2; } 50% { transform: scale(1) rotate(45deg); opacity: 1; } }
.scene .a-drop { animation: aDrop 3s cubic-bezier(.5,0,.8,.6) infinite; transform-box: fill-box; transform-origin: center; }
@keyframes aDrop { 0% { transform: translateY(-34px) rotate(0); opacity: 0; } 12% { opacity: 1; } 55% { transform: translateY(18px) rotate(280deg); opacity: 1; } 62%, 100% { transform: translateY(22px) rotate(320deg); opacity: 0; } }
.scene .a-write { stroke-dasharray: 90; stroke-dashoffset: 90; animation: aWrite 3.2s ease-in-out infinite; }
@keyframes aWrite { 0% { stroke-dashoffset: 90; } 55%, 85% { stroke-dashoffset: 0; } 100% { stroke-dashoffset: 0; opacity: 0; } }
.scene .a-pencil { animation: aPencil 3.2s ease-in-out infinite; transform-box: fill-box; transform-origin: 0 100%; }
@keyframes aPencil { 0% { transform: translate(-30px, 0) rotate(0); } 55% { transform: translate(0, 0) rotate(-6deg); } 70% { transform: translate(2px, 2px) rotate(2deg); } 100% { transform: translate(0, 0); } }
.scene .a-bar { transform-box: fill-box; transform-origin: bottom; animation: aBar 3s cubic-bezier(.3,1.2,.4,1) infinite; }
.scene .a-bar.d1 { animation-delay: .15s; } .scene .a-bar.d2 { animation-delay: .3s; }
@keyframes aBar { 0% { transform: scaleY(.1); } 35%, 85% { transform: scaleY(1); } 100% { transform: scaleY(.1); } }
.scene .a-pulse { animation: aPulse 2.2s ease-in-out infinite; transform-box: fill-box; transform-origin: center; }
@keyframes aPulse { 0%, 100% { transform: scale(1); } 50% { transform: scale(1.08); } }
.scene .a-stamp { animation: aStamp 3.4s cubic-bezier(.2,1.6,.4,1) infinite; transform-box: fill-box; transform-origin: center; }
@keyframes aStamp { 0%, 8% { transform: scale(2.4) rotate(-20deg); opacity: 0; } 22%, 90% { transform: scale(1) rotate(-8deg); opacity: 1; } 100% { opacity: 0; } }
.scene .a-scan { animation: aScan 2.6s ease-in-out infinite; }
@keyframes aScan { 0%, 100% { transform: translateY(0); opacity: .9; } 50% { transform: translateY(38px); opacity: .5; } }
.scene .a-up { animation: aUp 2.6s ease-in-out infinite; }
@keyframes aUp { 0% { transform: translateY(8px); opacity: 0; } 40% { opacity: 1; } 100% { transform: translateY(-10px); opacity: 0; } }
@media (prefers-reduced-motion: reduce) {
  svg.tim *, .scene * { animation: none !important; }
  .scene .a-write { stroke-dashoffset: 0; } .scene .a-bar { transform: none; }
}

  :root:not([data-theme="light"]) { --paper: #0e1512; --paper-2: #1c2822; --card: #17211c; --line: #26362e; --green-soft: #173a29; --gold-soft: #3a2f10; --edge: #1c6a45; --ink: #eaf1ec; --ink-2: #a5b5ab; --blue-soft: #172a42; --red-soft: #3d1d1b; --shadow-sm: 0 1px 2px rgba(0,0,0,.35), 0 3px 10px rgba(0,0,0,.25); --shadow: 0 12px 30px rgba(0,0,0,.5); }
}
:root[data-theme="dark"] { --paper: #0e1512; --paper-2: #1c2822; --card: #17211c; --line: #26362e; --green-soft: #173a29; --gold-soft: #3a2f10; --edge: #1c6a45; --ink: #eaf1ec; --ink-2: #a5b5ab; --blue-soft: #172a42; --red-soft: #3d1d1b; --shadow-sm: 0 1px 2px rgba(0,0,0,.35), 0 3px 10px rgba(0,0,0,.25); --shadow: 0 12px 30px rgba(0,0,0,.5); }

body { font-family: var(--font); background: var(--paper); position: relative; font-feature-settings: "kern", "liga"; }
body::before { content: ""; position: fixed; inset: 0; z-index: -1; pointer-events: none;
  background: radial-gradient(48rem 26rem at 105% -8%, color-mix(in srgb, var(--green) 13%, transparent), transparent 62%), radial-gradient(34rem 22rem at -12% 18%, color-mix(in srgb, var(--gold) 15%, transparent), transparent 58%); }

.money, .amount, .big, .num, .ring-c, .qt-l { font-variant-numeric: tabular-nums; font-feature-settings: "tnum"; }
h1, h2, h3 { letter-spacing: -.025em; }
main#view { animation: none; gap: 1rem; padding-bottom: calc(var(--tabbar-h) + 4.8rem + env(safe-area-inset-bottom)); }
main#view > * { min-width: 0; }
.ghost-view { background: transparent; }

/* ---------- Cabeçalho ---------- */
.app-header { background: color-mix(in srgb, var(--paper) 74%, transparent); backdrop-filter: blur(18px) saturate(1.5); -webkit-backdrop-filter: blur(18px) saturate(1.5); border-bottom: 1px solid transparent; transition: border-color .25s, box-shadow .25s; }

.brand { font-size: 1.22rem; letter-spacing: -.05em; font-weight: 800; }
.brand img { width: 2.25rem; height: 2.25rem; border-radius: .7rem; box-shadow: 0 3px 10px rgba(31,122,77,.35); }
.chip { background: linear-gradient(145deg, #ffe590, #ffc23d); color: #5a3900; box-shadow: 0 .16rem 0 #d79308; font-weight: 800; border-radius: 99px; min-height: 2.25rem; padding: .25rem .75rem; }
.chip .ic { color: #e2680a; }
.chip.off { background: var(--paper-2); color: var(--ink-2); box-shadow: 0 .16rem 0 var(--line); } .chip.off .ic { color: var(--green); }
.avatar { position: relative; isolation: isolate; width: 2.6rem; height: 2.6rem; background: conic-gradient(var(--gold) calc(var(--xp, 0) * 1%), color-mix(in srgb, var(--ink) 12%, transparent) 0); color: #fff; font-weight: 800; }
.avatar::before { content: ""; position: absolute; inset: .2rem; border-radius: 50%; background: linear-gradient(145deg, #3fb27a, #1f7a4d); z-index: -1; }
.avatar::after { content: attr(data-lvl); position: absolute; right: -.4rem; bottom: -.45rem; min-width: 1.1rem; height: 1.1rem; padding: 0 .25rem; border-radius: 99px; background: var(--gold); color: #3a2400; font-size: .64rem; font-weight: 800; display: grid; place-items: center; border: 2px solid var(--paper); }
.avatar[data-lvl=""]::after { display: none; }

/* ---------- Barra de abas flutuante ---------- */
.tabbar { left: .8rem; right: .8rem; bottom: calc(.75rem + env(safe-area-inset-bottom)); height: 4.3rem; padding: .3rem; border-radius: 1.9rem; border: 1px solid color-mix(in srgb, var(--line) 85%, transparent);
  background: color-mix(in srgb, var(--card) 86%, transparent); backdrop-filter: blur(22px) saturate(1.6); -webkit-backdrop-filter: blur(22px) saturate(1.6);
  box-shadow: 0 16px 36px rgba(15,40,28,.22), 0 2px 8px rgba(15,40,28,.08); }
@media (min-width: 700px) { .tabbar { left: 50%; right: auto; width: min(34rem, calc(100% - 1.6rem)); transform: translateX(-50%); border-radius: 1.9rem; border: 1px solid color-mix(in srgb, var(--line) 85%, transparent); } }
.tab-ind { position: absolute; top: .3rem; bottom: .3rem; left: .3rem; width: calc((100% - .6rem) / 5); border-radius: 1.5rem; background: linear-gradient(160deg, var(--green-soft), color-mix(in srgb, var(--green) 18%, var(--card))); transform: translateX(calc(var(--i, 0) * 100%)); transition: transform .55s cubic-bezier(.3, 1.35, .5, 1), opacity .3s; z-index: 0; box-shadow: inset 0 0 0 1px color-mix(in srgb, var(--green) 18%, transparent); }
.tabbar.no-tab .tab-ind { opacity: 0; }
.tabbar a.tab { position: relative; z-index: 1; min-height: 3.6rem; font-size: .7rem; font-weight: 700; gap: .18rem; letter-spacing: .005em; transition: color .25s; }
.tabbar a.tab .ic { width: 1.5rem; height: 1.5rem; transition: transform .35s var(--spring); }
.tabbar a.tab.active { color: var(--green); font-weight: 800; }
.tabbar a.tab.active .ic { transform: translateY(-1px) scale(1.12); animation: tabPop .5s var(--spring); }
.tabbar a.tab:active .ic { transform: scale(.88); }
@keyframes tabPop { 0% { transform: scale(.7) translateY(4px); } 60% { transform: scale(1.25) translateY(-3px); } 100% { transform: translateY(-1px) scale(1.12); } }

/* ---------- Botão + e menu flutuante ---------- */
.fab { z-index: 47; width: 3.7rem; height: 3.7rem; border-radius: 1.35rem; bottom: calc(5.55rem + env(safe-area-inset-bottom)); background: linear-gradient(150deg, #ffdf7a, #f2b632 55%, #e69a0b); color: #3a2400;
  box-shadow: 0 .28rem 0 #b97800, 0 14px 26px rgba(185,120,0,.42); transition: transform .18s var(--spring), box-shadow .18s; }
.fab:active { transform: translateY(.22rem) scale(.97); box-shadow: 0 .05rem 0 #b97800, 0 6px 12px rgba(185,120,0,.4); }
.fab .ic { transition: transform .4s var(--spring); }
.fab.open .ic { transform: rotate(135deg); }
.fab::after { content: ""; position: absolute; inset: -.3rem; border-radius: 1.65rem; border: 2px solid color-mix(in srgb, var(--gold) 55%, transparent); animation: fabRing 2.8s ease-out infinite; pointer-events: none; }

.dial { position: fixed; inset: 0; z-index: 45; }
.dial-scrim { position: absolute; inset: 0; border: 0; background: rgba(8, 18, 12, .5); backdrop-filter: blur(7px); -webkit-backdrop-filter: blur(7px); cursor: default; }
.dial-items { position: absolute; right: max(1rem, env(safe-area-inset-right)); bottom: calc(5.55rem + 3.7rem + .9rem + env(safe-area-inset-bottom)); display: grid; gap: .7rem; justify-items: end; }
@media (min-width: 700px) { .dial-items { right: calc(50% - 17rem + 1rem); } }
.dial-item { display: flex; align-items: center; gap: .7rem; border: 0; background: none; padding: 0; color: inherit; }
.di-l { background: var(--card); color: var(--ink); font-weight: 800; font-size: .95rem; padding: .55rem .95rem; border-radius: 1rem; box-shadow: var(--shadow); white-space: nowrap; }
.di-ic { width: 3.2rem; height: 3.2rem; border-radius: 1.15rem; display: grid; place-items: center; color: #fff; box-shadow: 0 .22rem 0 rgba(0,0,0,.22), 0 10px 20px rgba(0,0,0,.25); }
.di-ic .ic { width: 1.5rem; height: 1.5rem; }
.dial-item:active .di-ic { transform: translateY(.18rem); box-shadow: 0 .04rem 0 rgba(0,0,0,.22); }
.dial-item.out .di-ic { background: linear-gradient(150deg, #ff9a7d, #e8472a); }
.dial-item.in .di-ic { background: linear-gradient(150deg, #4fd392, #1c9a5d); }
.dial-item.bill .di-ic { background: linear-gradient(150deg, #86b9ff, #386ccf); }
.dial-item.wa .di-ic { background: linear-gradient(150deg, #3fe07e, #11a24a); }
.dial-item.pix .di-ic { background: linear-gradient(150deg, #43dccb, #0d9a8a); }
body.dial-open { overflow: hidden; }
body.dial-open .toasts { z-index: 40; }

/* ---------- Títulos de tela ---------- */
.ph { display: flex; align-items: flex-end; justify-content: space-between; gap: .8rem; padding: .25rem 0 .1rem; }
.page-title { font-size: var(--fs-title); letter-spacing: -.05em; font-weight: 800; }
.page-sub { color: var(--ink-2); margin-top: .15rem; font-size: .95rem; }
.section-title { font-size: var(--fs-h2); letter-spacing: -.02em; gap: .55rem; margin-top: .5rem; }
.section-title > .ic:first-child { width: 2rem; height: 2rem; padding: .42rem; border-radius: .7rem; background: var(--green-soft); color: var(--green); }
.sh { display: flex; align-items: center; justify-content: space-between; gap: .5rem; margin: .1rem 0; }
.sh h2 { font-size: 1.1rem; font-weight: 800; display: flex; align-items: center; gap: .55rem; letter-spacing: -.03em; }
.sh-ic { width: 2rem; height: 2rem; border-radius: .7rem; display: grid; place-items: center; background: var(--green-soft); color: var(--green); }
.n { font-style: normal; font-size: .74rem; font-weight: 800; background: var(--paper-2); color: var(--ink-2); border-radius: 99px; padding: .08rem .5rem; margin-left: .3rem; }
.n.bad { background: var(--red-soft); color: var(--red); } .n.warn { background: var(--gold-soft); color: var(--gold-d); }
.link { font-weight: 800; }

/* ---------- Cartões e linhas ---------- */
.card { border-radius: var(--radius); padding: 1.05rem; border: 1px solid color-mix(in srgb, var(--line) 75%, transparent); box-shadow: var(--shadow-sm); }
.row { padding: .72rem 0; transition: background .15s; }
.row:active { background: color-mix(in srgb, var(--ink) 4%, transparent); }
.row-ico { border-radius: .95rem; }
.row-ico.cat { background: color-mix(in srgb, var(--cat, #8a98a8) 16%, var(--card)); color: var(--cat, var(--ink-2)); }
.row-ico.cat .ic { width: 1.3rem; height: 1.3rem; }
:root[data-theme="dark"] .row-ico.cat { color: color-mix(in srgb, var(--cat) 70%, #fff); }
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) .row-ico.cat { color: color-mix(in srgb, var(--cat) 70%, #fff); } }
.row-main b { font-weight: 700; letter-spacing: -.01em; }
.amount { font-weight: 800; letter-spacing: -.02em; }
.amount.in { color: var(--green); } .amount.meta { color: var(--blue); }
.badge { display: inline-flex; align-items: center; gap: .25rem; font-size: .74rem; font-weight: 800; padding: .2rem .6rem; border-radius: 99px; background: var(--green-soft); color: var(--green); white-space: nowrap; }
.badge.warn { background: var(--gold-soft); color: var(--gold-d); } .badge.bad { background: var(--red-soft); color: var(--red); }
.tag { background: var(--blue-soft); color: var(--blue); }
.daycard { padding: .55rem 1rem .35rem; gap: 0; }
.day-head { padding: .4rem 0 .3rem; font-size: .8rem; letter-spacing: .02em; text-transform: uppercase; }
.day-head .num.pos { color: var(--green); } .day-head .num.neg { color: var(--red); }
.stack { display: grid; gap: .8rem; }

/* ---------- Botões ---------- */
.btn { min-height: 3rem; border-radius: 1.05rem; font-weight: 800; letter-spacing: -.005em; border-width: 2px; transition: transform .1s, box-shadow .1s, filter .15s; }
.btn.primary { background: linear-gradient(180deg, color-mix(in srgb, var(--green) 82%, #fff), var(--green)); border-color: transparent; color: var(--on-green, #fff); box-shadow: 0 .22rem 0 var(--edge), 0 10px 20px color-mix(in srgb, var(--green) 28%, transparent); }
.btn.primary:active { transform: translateY(.2rem); box-shadow: 0 .02rem 0 var(--edge); }
.btn.ghost { background: color-mix(in srgb, var(--card) 90%, transparent); border-color: color-mix(in srgb, var(--green) 55%, var(--line)); color: var(--green); box-shadow: 0 .18rem 0 color-mix(in srgb, var(--green) 25%, var(--line)); }
.btn.ghost:active { transform: translateY(.16rem); box-shadow: none; }
.btn.wa { background: linear-gradient(180deg, #34d170, #1fa855); border-color: transparent; box-shadow: 0 .22rem 0 #0e7a3a; }
.btn.wa:active { transform: translateY(.2rem); box-shadow: none; }
.btn.small { min-height: 2.75rem; border-radius: .9rem; }
.btn:disabled { box-shadow: none; }
.icon-btn { background: var(--card); border: 1px solid var(--line); box-shadow: 0 .14rem 0 var(--line); }
.icon-btn:active { transform: translateY(.12rem); box-shadow: none; }
.icon-btn:disabled { opacity: .4; }
.pill { border-width: 1.5px; min-height: 2.6rem; padding: .3rem .95rem; box-shadow: 0 .14rem 0 var(--line); transition: transform .1s, background .2s; }
.pill:active { transform: translateY(.12rem); box-shadow: none; }
.pill.active { background: linear-gradient(180deg, color-mix(in srgb, var(--green) 85%, #fff), var(--green)); border-color: transparent; color: var(--on-green, #fff); box-shadow: 0 .14rem 0 var(--edge); }
.pill .n { margin-left: .1rem; background: color-mix(in srgb, var(--ink) 8%, transparent); }
.pill.active .n { background: rgba(255,255,255,.25); color: inherit; }
.search { border-radius: 1.05rem; box-shadow: var(--shadow-sm); }
.search .ic { color: var(--ink-2); }
.month-nav { background: var(--card); border: 1px solid var(--line); border-radius: 1.3rem; padding: .3rem; box-shadow: var(--shadow-sm); }
.month-nav b { letter-spacing: -.03em; }
.month-nav .icon-btn { box-shadow: none; border: 0; background: var(--paper-2); }
.field input, .field select, .field textarea { border-radius: .95rem; }

/* ---------- Início: Tim + balão ---------- */
.hello { display: flex; align-items: flex-end; gap: .5rem; margin: -.1rem 0 -.2rem; }
.hello-tim { flex: none; }
.hello-tim svg.tim { width: 5.1rem; height: 5.6rem; }
.hello-b { position: relative; flex: 1; background: var(--card); border: 1px solid var(--line); border-radius: 1.3rem 1.3rem 1.3rem .35rem; padding: .75rem .95rem; box-shadow: var(--shadow-sm); font-size: .95rem; line-height: 1.4; margin-bottom: 1.1rem; }
.hello-b::before { content: ""; position: absolute; left: -.42rem; bottom: .5rem; width: .85rem; height: .85rem; background: var(--card); border: 1px solid var(--line); border-width: 0 0 1px 1px; transform: rotate(45deg); border-radius: 0 0 0 .25rem; }
.hello-b b { font-weight: 800; letter-spacing: -.02em; }

/* ---------- Início: card "o que fazer agora" ---------- */
.nba { position: relative; isolation: isolate; overflow: hidden; border-radius: 1.7rem; padding: 1.15rem 1.1rem 1.15rem 1.2rem; color: #fff;
  display: grid; grid-template-columns: 1fr 6.4rem; grid-template-areas: "body art"; gap: .3rem .5rem; align-items: center;
  background: linear-gradient(150deg, #34a872 0%, #1f7a4d 48%, #0e4a2e 100%); box-shadow: 0 .32rem 0 #0a3a23, 0 20px 38px rgba(15,74,46,.34); }
.nba::before { content: ""; position: absolute; z-index: -1; right: -4rem; top: -5rem; width: 17rem; height: 17rem; border-radius: 50%; background: radial-gradient(closest-side, rgba(255,255,255,.2), transparent); }
.nba::after { content: ""; position: absolute; z-index: -1; left: -3rem; bottom: -5rem; width: 12rem; height: 12rem; border-radius: 50%; background: radial-gradient(closest-side, rgba(255,226,130,.2), transparent); }
.nba.warn { color: #3a2400; background: linear-gradient(150deg, #ffe07a 0%, #f6bd2f 50%, #dd9109 100%); box-shadow: 0 .32rem 0 #a96d00, 0 20px 38px rgba(217,138,11,.36); }
.nba.bad { background: linear-gradient(150deg, #ff9272 0%, #ee5636 52%, #b92c14 100%); box-shadow: 0 .32rem 0 #86200d, 0 20px 38px rgba(185,44,20,.36); }
.nba-body { grid-area: body; min-width: 0; }
.nba-art { grid-area: art; align-self: center; margin-right: -.4rem; }
.nba-art svg.scene { width: 100%; filter: drop-shadow(0 8px 10px rgba(0,0,0,.22)); }
.nba-tag { display: inline-flex; align-items: center; gap: .35rem; font-size: .7rem; font-weight: 800; letter-spacing: .07em; text-transform: uppercase; background: rgba(255,255,255,.2); padding: .28rem .65rem; border-radius: 99px; }
.nba.warn .nba-tag { background: rgba(58,36,0,.12); }
.nba-tag .ic { width: 1em; height: 1em; }
.nba h2 { font-size: 1.32rem; line-height: 1.17; font-weight: 800; letter-spacing: -.035em; margin: .55rem 0 .3rem; }
.nba p { font-size: .92rem; opacity: .93; line-height: 1.4; }
.nba-act { display: flex; flex-wrap: wrap; gap: .4rem .8rem; margin-top: .85rem; align-items: center; }
.nba-cta { display: inline-flex; align-items: center; gap: .3rem; background: #fff; color: #0e4a2e; border: 0; border-radius: 1.05rem; padding: .72rem 1.05rem; font-weight: 800; font-size: 1rem; letter-spacing: -.01em; text-decoration: none; box-shadow: 0 .24rem 0 rgba(0,0,0,.24); animation: nbaPulse 2.6s ease-in-out infinite; transition: transform .1s, box-shadow .1s; }
.nba.warn .nba-cta { color: #5a3900; } .nba.bad .nba-cta { color: #8a1f0c; }
.nba-cta:active { transform: translateY(.22rem); box-shadow: 0 .02rem 0 rgba(0,0,0,.24); animation: none; }
.nba-cta .ic { width: 1.1em; height: 1.1em; stroke-width: 3; }
.nba-alt { background: transparent; color: inherit; border: 0; text-decoration: underline; text-underline-offset: .2em; font-weight: 700; font-size: .9rem; opacity: .92; padding: .5rem .1rem; }
@keyframes nbaPulse { 0%, 100% { transform: scale(1); } 50% { transform: scale(1.04); } }

/* ---------- Saldo ---------- */
.balance.hero { border-radius: 1.7rem; padding: 1.15rem; gap: .6rem; background: linear-gradient(155deg, #23865a 0%, #176342 55%, #0e4a2e 100%); box-shadow: 0 18px 36px rgba(15,74,46,.3); isolation: isolate; }
.balance.hero::after { display: none; }
.hero-deco { position: absolute; right: 0; top: 0; width: 70%; height: 100%; z-index: -1; pointer-events: none; }
.balance .eyebrow { font-weight: 700; letter-spacing: .01em; font-size: .86rem; opacity: .92; }
.balance .big { font-size: var(--fs-big); letter-spacing: -.055em; }
.hero-spark { height: 2.7rem; margin: -.2rem -.15rem 0; } .hero-spark svg { width: 100%; height: 100%; display: block; }
.balance .split > div { display: flex; align-items: center; gap: .6rem; background: rgba(255,255,255,.13); border-radius: 1.05rem; padding: .6rem .7rem; backdrop-filter: blur(4px); }
.balance .split .dot { width: 2.1rem; height: 2.1rem; border-radius: .75rem; background: rgba(255,255,255,.18); display: grid; place-items: center; flex: none; }
.balance .split .in .dot { background: rgba(120,240,170,.3); } .balance .split .out .dot { background: rgba(255,160,130,.34); }
.sp-t { display: grid; min-width: 0; } .balance .split b { font-size: 1.02rem; letter-spacing: -.03em; overflow: hidden; text-overflow: ellipsis; }
.balance .saved-note { font-weight: 600; }
.balance.gold-hero { background: linear-gradient(155deg, #ffd24f 0%, #f1ad1c 55%, #d28706 100%); color: #3a2400; box-shadow: 0 18px 36px rgba(217,138,11,.32); }
.balance.gold-hero .bar { background: rgba(58,36,0,.18); } .balance.gold-hero .bar > i { background: #fff; }
.eye-btn { transition: transform .1s, background .2s; } .eye-btn:active { transform: scale(.9); }

/* ---------- Atalhos grandes ---------- */
.quick-tiles { display: grid; grid-template-columns: repeat(4, 1fr); gap: .6rem; }
.qt { display: grid; justify-items: center; align-content: start; gap: .45rem; background: var(--card); border: 1px solid var(--line); border-radius: 1.3rem; padding: .8rem .2rem .7rem; font-weight: 800; font-size: .82rem; letter-spacing: -.01em; box-shadow: 0 .22rem 0 var(--line), var(--shadow-sm); transition: transform .1s, box-shadow .1s; }
.qt:active { transform: translateY(.2rem); box-shadow: 0 .02rem 0 var(--line); }
.qt-ic { width: 3rem; height: 3rem; border-radius: 1.05rem; display: grid; place-items: center; color: #fff; box-shadow: inset 0 -.18rem 0 rgba(0,0,0,.14), 0 6px 12px rgba(0,0,0,.14); }
.qt-ic .ic { width: 1.45rem; height: 1.45rem; stroke-width: 2.6; }
.qt.in .qt-ic { background: linear-gradient(150deg, #4fd392, #1c9a5d); } .qt.out .qt-ic { background: linear-gradient(150deg, #ff9a7d, #e8472a); }
.qt.bill .qt-ic { background: linear-gradient(150deg, #86b9ff, #386ccf); } .qt.pix .qt-ic { background: linear-gradient(150deg, #43dccb, #0d9a8a); }

/* ---------- Primeiros passos / jornada ---------- */
.steps-head { display: flex; align-items: center; gap: .9rem; }
.steps-head h2 { font-size: 1.12rem; font-weight: 800; letter-spacing: -.03em; }
.ring.sm .ring-c b { font-size: .86rem; }
.step { display: flex; align-items: center; gap: .75rem; padding: .62rem .1rem; width: 100%; text-align: left; background: none; border: 0; border-bottom: 1px solid var(--line); transition: background .15s; }
.step:last-child { border-bottom: 0; } .step:not(.done):active { background: color-mix(in srgb, var(--ink) 4%, transparent); }
.st-ck { width: 2.5rem; height: 2.5rem; border-radius: 50%; display: grid; place-items: center; flex: none; background: var(--gold-soft); color: var(--gold-d); border: 2px dashed color-mix(in srgb, var(--gold) 80%, transparent); }
.step.done .st-ck { background: linear-gradient(150deg, #3fc486, #1f7a4d); color: #fff; border: 0; box-shadow: 0 .14rem 0 var(--edge); }
.step.done .row-main b { text-decoration: line-through; color: var(--ink-2); font-weight: 600; }
.step .go { color: var(--ink-2); width: 1.2rem; height: 1.2rem; }
.j-top { display: flex; gap: .85rem; align-items: center; }
.j-badge { width: 3.5rem; height: 4rem; flex: none; filter: drop-shadow(0 5px 6px rgba(15,74,46,.28)); }

.ob-panel.vault { --ob-bg: radial-gradient(120% 80% at 50% 0%, #1b6a45 0%, #0f3d28 55%, #08261a 100%); --ob-fg: #fff; --ink: #fff; --ink-2: rgba(255,255,255,.8); --line: rgba(255,255,255,.22); --card: rgba(255,255,255,.08); --paper: #0b2e1f; --green-soft: rgba(63,178,122,.22); --green: #3fb27a; --green-d: #7fdcae; }
.ob-body { flex: 1; overflow-y: auto; overscroll-behavior: contain; padding: calc(4.2rem + env(safe-area-inset-top)) max(1.2rem, env(safe-area-inset-right)) 1rem max(1.2rem, env(safe-area-inset-left)); display: grid; gap: .9rem; align-content: start; max-width: 34rem; width: 100%; margin: 0 auto; }
.ob-panel.center .ob-body { display: flex; flex-direction: column; align-items: center; text-align: center; }
.ob-panel.center .ob-body > :first-child { margin-top: auto; }
.ob-panel.center .ob-body > :last-child { margin-bottom: auto; }
.ob-foot { flex: none; display: grid; gap: .55rem; padding: .7rem max(1.2rem, env(safe-area-inset-right)) calc(1rem + env(safe-area-inset-bottom)) max(1.2rem, env(safe-area-inset-left)); max-width: 34rem; width: 100%; margin: 0 auto; }

.ob-title { font-size: 1.65rem; font-weight: 800; letter-spacing: -.03em; line-height: 1.15; }
.ob-big { font-size: 2.1rem; font-weight: 800; letter-spacing: -.035em; line-height: 1.1; }
.ob-sub { color: var(--ink-2); font-size: 1.02rem; }
.ob-panel.center .ob-sub { max-width: 24rem; }

.ob-cta { width: 100%; min-height: 3.5rem; border: 0; border-radius: 1.2rem; background: linear-gradient(180deg, color-mix(in srgb, var(--green) 82%, #fff), var(--green)); color: var(--on-green, #fff); font-weight: 800; font-size: 1.08rem; letter-spacing: .01em; box-shadow: 0 .28rem 0 var(--green-d); transition: transform .08s, box-shadow .08s, opacity .2s, background .2s; position: relative; }
.ob-cta:active:not(:disabled) { transform: translateY(.22rem); box-shadow: 0 .06rem 0 var(--green-d); }
.ob-cta:disabled { background: var(--line); color: var(--ink-2); box-shadow: 0 .28rem 0 rgba(127,127,127,.25); cursor: not-allowed; }
.ob-panel.green .ob-cta, .ob-panel.vault .ob-cta { background: linear-gradient(180deg, #ffd45e, #f2b632); color: #3a2800; box-shadow: 0 .28rem 0 #b9810a; }
.ob-panel.green .ob-cta:disabled, .ob-panel.vault .ob-cta:disabled { background: rgba(255,255,255,.2); color: rgba(255,255,255,.7); box-shadow: 0 .28rem 0 rgba(0,0,0,.15); }
.ob-cta.pulse:not(:disabled) { animation: obPulse 2.2s ease-in-out infinite; }
@keyframes obPulse { 0%,100% { transform: none; } 50% { transform: scale(1.025); } }
.ob-link { border: 0; background: transparent; color: inherit; font-weight: 800; font-size: var(--fs-small); padding: .6rem; text-align: center; opacity: .9; text-decoration: underline; text-underline-offset: .2rem; }
.ob-ghost { width: 100%; min-height: 3rem; border-radius: 1.1rem; background: transparent; border: 2px solid rgba(255,255,255,.55); color: #fff; font-weight: 800; }

/* Tim, o mascote */
.ob-tim { display: flex; align-items: flex-end; gap: .7rem; }
.ob-tim .tim { width: 5.4rem; height: 5.9rem; flex: none; }
.ob-panel.center .ob-tim { flex-direction: column; align-items: center; }
.ob-panel.center .ob-tim .tim { width: 9.4rem; height: 10.3rem; }
.ob-bubble { position: relative; background: var(--card); border: 1px solid var(--line); border-radius: 1.3rem 1.3rem 1.3rem .35rem; padding: .75rem .95rem; font-size: .98rem; line-height: 1.4; box-shadow: var(--shadow-sm); flex: 1; }
.ob-bubble::before { content: ""; position: absolute; left: -.45rem; bottom: 1.1rem; width: .85rem; height: .85rem; background: inherit; border-left: 1px solid var(--line); border-bottom: 1px solid var(--line); transform: rotate(45deg); border-radius: 0 0 0 .25rem; }
.ob-bubble b { font-weight: 800; }

/* Opções (cartões de escolha) */
.ob-opts { display: grid; gap: .6rem; }
.ob-opt { display: flex; align-items: center; gap: .85rem; width: 100%; text-align: left; padding: .8rem .9rem; border-radius: 1.1rem; background: var(--card); border: 2px solid var(--line); box-shadow: 0 .2rem 0 var(--line); color: var(--ink); transition: transform .12s, border-color .15s, background .15s, box-shadow .12s; position: relative; min-height: 3.6rem; }
.ob-opt:active { transform: translateY(.15rem); box-shadow: 0 .05rem 0 var(--line); }
.ob-opt .oi { flex: none; width: 2.7rem; height: 2.7rem; border-radius: .9rem; display: grid; place-items: center; background: var(--paper-2); color: var(--green); }
.ob-opt .oi .ic { width: 1.5rem; height: 1.5rem; }
.ob-opt b { display: block; font-size: 1.02rem; line-height: 1.2; }
.ob-opt small { display: block; color: var(--ink-2); font-size: var(--fs-small); margin-top: .1rem; }
.ob-opt .ck { margin-left: auto; flex: none; width: 1.7rem; height: 1.7rem; border-radius: 50%; border: 2px solid var(--line); display: grid; place-items: center; color: transparent; transition: all .2s; }
.ob-opt.on { border-color: var(--green); background: var(--green-soft); box-shadow: 0 .2rem 0 var(--green); }
.ob-opt.on .ck { background: var(--green); border-color: var(--green); color: var(--on-green); animation: obPop .35s cubic-bezier(.2,1.6,.4,1); }

@keyframes obPop { 0% { transform: scale(.3); } 100% { transform: scale(1); } }
.ob-chips { display: flex; flex-wrap: wrap; gap: .5rem; }
.ob-chip { border: 2px solid var(--line); background: var(--card); color: var(--ink); border-radius: 99px; padding: .5rem .9rem; font-weight: 700; font-size: .95rem; min-height: 2.6rem; transition: all .15s; }
.ob-chip.on { border-color: var(--green); background: var(--green-soft); color: var(--green-d); transform: scale(1.04); }
.ob-field { display: grid; gap: .35rem; }
.ob-field > span { font-weight: 800; font-size: var(--fs-small); }
.ob-input { width: 100%; min-height: 3.3rem; padding: .6rem .95rem; border-radius: 1rem; border: 2px solid var(--line); background: var(--card); color: var(--ink); font: inherit; font-size: 1.12rem; transition: border-color .15s, box-shadow .15s; }
.ob-input:focus { outline: none; border-color: var(--green); box-shadow: 0 0 0 4px var(--green-soft); }
.ob-input.big { font-size: 1.7rem; font-weight: 800; text-align: center; letter-spacing: -.02em; min-height: 4rem; }
.ob-panel.vault .ob-input { background: rgba(255,255,255,.1); color: #fff; border-color: rgba(255,255,255,.28); }
.ob-panel.vault .ob-input::placeholder { color: rgba(255,255,255,.55); }

.ob-msg { font-size: var(--fs-small); font-weight: 700; padding: .6rem .8rem; border-radius: .8rem; }
.ob-msg.bad { background: rgba(196,55,47,.18); color: #ffb4ae; }

.ob-msg.warn { background: var(--gold-soft); color: var(--gold-d); }
.ob-panel.vault .ob-msg.warn { background: rgba(242,182,50,.18); color: #ffe08a; }
.ob-greet { min-height: 1.6em; font-size: 1.25rem; font-weight: 800; color: var(--green); letter-spacing: -.02em; text-align: center; }
.ob-greet span { display: inline-block; animation: obLetter .35s cubic-bezier(.2,1.6,.4,1) both; white-space: pre; }
@keyframes obLetter { from { transform: translateY(.6rem) scale(.4); opacity: 0; } }
.ob .help { background: var(--blue-soft); }
.ob-panel.vault .help { background: rgba(255,255,255,.1); color: #fff; } .ob-panel.vault .help .ic { color: #f2b632; }

/* Medidor do limite */
.ob-gauge { position: relative; width: min(100%, 17rem); margin: 0 auto; }
.ob-gauge svg { width: 100%; display: block; overflow: visible; }
.ob-gauge .trk { stroke: var(--line); } .ob-gauge .val { stroke: var(--green); transition: stroke-dashoffset .6s cubic-bezier(.3,1.3,.5,1), stroke .3s; }
.ob-gauge .num { position: absolute; left: 0; right: 0; bottom: .1rem; text-align: center; font-size: 1.55rem; font-weight: 800; letter-spacing: -.03em; font-variant-numeric: tabular-nums; }
.ob-gauge .num small { display: block; font-size: var(--fs-tiny); color: var(--ink-2); font-weight: 700; letter-spacing: 0; }
/* Cofrinho */
.ob-jar { width: 8rem; height: 8rem; margin: 0 auto; display: block; overflow: visible; }
.ob-jar .fill { transform-box: fill-box; transform-origin: bottom; animation: jarFill 3.6s ease-in-out infinite; }
@keyframes jarFill { 0% { transform: scaleY(.12); } 70%,100% { transform: scaleY(.85); } }
.ob-jar .cn { animation: jarCoin 3.6s ease-in infinite; transform-box: fill-box; transform-origin: center; }
.ob-jar .cn.c2 { animation-delay: 1.2s; } .ob-jar .cn.c3 { animation-delay: 2.4s; }
@keyframes jarCoin { 0% { transform: translateY(-3.2rem) rotate(0); opacity: 0; } 10% { opacity: 1; } 28% { transform: translateY(1.8rem) rotate(200deg); opacity: 1; } 34%,100% { transform: translateY(2.2rem) rotate(240deg); opacity: 0; } }
/* Pix / WhatsApp */
.ob-chat { display: grid; gap: .5rem; justify-items: end; width: min(100%, 20rem); margin: 0 auto; }
.ob-chat .msg { background: #d9fdd3; color: #0b3d1f; border-radius: 1rem 1rem .25rem 1rem; padding: .6rem .8rem; font-size: .95rem; font-weight: 600; box-shadow: var(--shadow-sm); display: grid; gap: .4rem; justify-items: center; opacity: 0; animation: chatIn .5s .3s cubic-bezier(.2,1.4,.4,1) forwards; }

.ob-chat .paid { background: var(--green); color: var(--on-green); border-radius: 99px; padding: .45rem .9rem; font-weight: 800; display: inline-flex; gap: .4rem; align-items: center; opacity: 0; animation: chatIn .5s 1.5s cubic-bezier(.2,1.6,.4,1) forwards; justify-self: start; }
@keyframes chatIn { from { opacity: 0; transform: translateY(1rem) scale(.8); } to { opacity: 1; transform: none; } }
/* Cadeado */
.ob-lock { width: 7rem; height: 7rem; margin: 0 auto; display: block; overflow: visible; }
.ob-lock .shackle { transform-box: fill-box; transform-origin: 85% 100%; animation: lockOpen 3.4s ease-in-out infinite; }
@keyframes lockOpen { 0%,15% { transform: translateY(-.9rem) rotate(-28deg); } 35%,85% { transform: none; } 100% { transform: translateY(-.9rem) rotate(-28deg); } }
.ob-lock .body { animation: lockGlow 3.4s ease-in-out infinite; }
@keyframes lockGlow { 0%,30% { filter: none; } 40%,80% { filter: drop-shadow(0 0 .7rem rgba(242,182,50,.8)); } 100% { filter: none; } }
.ob-perks { display: grid; gap: .5rem; text-align: left; width: 100%; }
.ob-perk { display: flex; gap: .65rem; align-items: center; font-weight: 700; font-size: .98rem; }
.ob-perk .ic { color: #f2b632; flex: none; width: 1.35rem; height: 1.35rem; }
.ob-seg { display: grid; grid-template-columns: 1fr 1fr; gap: .3rem; padding: .3rem; border-radius: 1rem; background: rgba(255,255,255,.12); }
.ob-seg button { border: 0; border-radius: .75rem; background: transparent; color: #fff; font-weight: 800; padding: .6rem; min-height: 2.8rem; transition: all .2s; }
.ob-seg button.on { background: #f2b632; color: #3a2800; }
.ob-check { display: flex; align-items: center; gap: .5rem; font-size: var(--fs-small); font-weight: 700; }
.ob-check input { width: 1.2rem; height: 1.2rem; accent-color: #f2b632; }
/* Visual (temas) */
.ob-themes { display: grid; grid-template-columns: repeat(3, 1fr); gap: .6rem; }
.ob-th { border: 2px solid var(--line); border-radius: 1rem; background: var(--card); padding: .5rem .5rem .6rem; display: grid; gap: .4rem; justify-items: center; font-weight: 800; font-size: var(--fs-small); color: var(--ink); transition: all .2s; box-shadow: 0 .2rem 0 var(--line); }
.ob-th.on { border-color: var(--green); box-shadow: 0 .2rem 0 var(--green); transform: translateY(-.15rem); }
.ob-th .thp { width: 100%; aspect-ratio: 3/4; border-radius: .6rem; padding: .35rem; display: grid; gap: .25rem; align-content: start; border: 1px solid rgba(127,127,127,.3); }
.ob-th .thp i { display: block; height: .45rem; border-radius: .2rem; }
.ob-th .thp i:first-child { height: .7rem; }
.ob-th .thp i.g { background: #1f7a4d; width: 60%; } .ob-th .thp i.y { background: #f2b632; width: 40%; }
.ob-th .thp.l { background: #fffdf6; } .ob-th .thp.l i { background: #e6e0cf; } .ob-th .thp.l i.g { background: #1f7a4d; } .ob-th .thp.l i.y { background: #f2b632; }
.ob-th .thp.d { background: #121a16; } .ob-th .thp.d i { background: #2b3a32; } .ob-th .thp.d i.g { background: #3fb27a; } .ob-th .thp.d i.y { background: #f2c75a; }
.ob-th .thp.a { background: linear-gradient(115deg, #fffdf6 50%, #121a16 50%); } .ob-th .thp.a i { background: #8aa090; } .ob-th .thp.a i.g { background: #2e9a64; } .ob-th .thp.a i.y { background: #f2b632; }
.ob-row { display: flex; align-items: center; gap: .75rem; padding: .7rem .9rem; border-radius: 1rem; background: var(--card); border: 2px solid var(--line); }
.ob-row .grow { flex: 1; display: grid; } .ob-row small { color: var(--ink-2); font-size: var(--fs-small); }
.ob-row > .ic { color: var(--green); width: 1.4rem; height: 1.4rem; }
/* Passeio (barra de abas de mentira) */
.ob-tour-card { background: var(--card); border: 2px solid var(--line); border-radius: 1.3rem; padding: 1.1rem; display: grid; gap: .5rem; min-height: 11rem; align-content: start; box-shadow: var(--shadow); overflow: hidden; position: relative; }
.ob-tour-card .tc-ic { width: 3.2rem; height: 3.2rem; border-radius: 1rem; display: grid; place-items: center; background: var(--green); color: var(--on-green); }
.ob-tour-card .tc-ic .ic { width: 1.8rem; height: 1.8rem; }
.ob-tour-card h3 { font-size: 1.3rem; font-weight: 800; letter-spacing: -.02em; }
.ob-tour-card p { color: var(--ink-2); }
.ob-tour-card .tc-tip { font-size: var(--fs-small); font-weight: 800; color: var(--gold-d); background: var(--gold-soft); padding: .4rem .65rem; border-radius: .7rem; justify-self: start; }
.ob-tabs { display: grid; grid-template-columns: repeat(5, 1fr); background: var(--card); border: 2px solid var(--line); border-radius: 1.2rem; padding: .3rem; gap: .2rem; position: relative; }
.ob-tabs button { border: 0; background: transparent; color: var(--ink-2); display: grid; justify-items: center; gap: .1rem; padding: .45rem 0; border-radius: .9rem; font-size: var(--fs-tiny); font-weight: 800; position: relative; z-index: 1; transition: color .2s, transform .2s; }
.ob-tabs button .ic { width: 1.5rem; height: 1.5rem; }
.ob-tabs button.on { color: var(--on-green); transform: translateY(-.1rem); }
.ob-tabs .hl { position: absolute; z-index: 0; top: .3rem; bottom: .3rem; left: .3rem; width: calc((100% - .6rem) / 5); border-radius: .9rem; background: var(--green); transition: transform .45s cubic-bezier(.3,1.4,.5,1); }
.ob-dots { display: flex; gap: .35rem; justify-content: center; }
.ob-dots i { width: .45rem; height: .45rem; border-radius: 50%; background: var(--line); transition: all .3s; }
.ob-dots i.on { background: var(--green); width: 1.3rem; border-radius: 99px; }
/* Final */
.ob-sum { display: flex; flex-wrap: wrap; gap: .45rem; justify-content: center; }
.ob-sum span { background: rgba(255,255,255,.16); border: 1px solid rgba(255,255,255,.3); padding: .4rem .75rem; border-radius: 99px; font-weight: 800; font-size: var(--fs-small); display: inline-flex; gap: .4rem; align-items: center; }
.ob-sum .ic { width: 1rem; height: 1rem; }
.ob-steps { display: grid; gap: .5rem; width: 100%; text-align: left; }
.ob-step { display: flex; align-items: center; gap: .7rem; background: rgba(255,255,255,.12); border: 1px solid rgba(255,255,255,.25); border-radius: 1rem; padding: .7rem .85rem; color: #fff; font-weight: 700; width: 100%; text-align: left; }
.ob-step .n { flex: none; width: 1.7rem; height: 1.7rem; border-radius: 50%; background: #f2b632; color: #3a2800; display: grid; place-items: center; font-weight: 800; font-size: var(--fs-small); }
.ob-step small { display: block; font-weight: 500; opacity: .85; }
.ob-step .arrow { margin-left: auto; opacity: .8; }
/* partículas */
.ob-fx { position: absolute; inset: 0; pointer-events: none; overflow: hidden; z-index: 0; }
.ob-fx i { position: absolute; top: -2rem; width: .9rem; height: .9rem; border-radius: 50%; background: radial-gradient(circle at 35% 30%, #ffe08a, #f2b632 60%, #c98400); animation: obFall linear infinite; opacity: .55; }
.ob-fx i.c { border-radius: .15rem; width: .55rem; height: .9rem; opacity: .9; }
@keyframes obFall { to { transform: translateY(110vh) rotate(540deg); } }
.ob-panel > .ob-body, .ob-panel > .ob-foot { position: relative; z-index: 1; }
.ob-burst { position: fixed; width: .55rem; height: .55rem; border-radius: 50%; background: #f2b632; pointer-events: none; z-index: 450; }
.ob-shake { animation: obShake .4s; }
@keyframes obShake { 20%,60% { transform: translateX(-.4rem); } 40%,80% { transform: translateX(.4rem); } }
::view-transition-old(root), ::view-transition-new(root) { animation: none; mix-blend-mode: normal; }
@media (prefers-reduced-motion: reduce) { .ob *, .ob *::before, .ob *::after { animation-duration: .01s !important; animation-iteration-count: 1 !important; transition-duration: .01s !important; } .ob-fx { display: none; } }

body.ob-open .overlay { z-index: 450; } body.ob-open .toasts { z-index: 460; bottom: calc(6rem + env(safe-area-inset-bottom)); }

.ob-panel.center .tim { width: 10.4rem; height: 11.4rem; }
.ob-panel.center .ob-tim .tim { width: 9.4rem; height: 10.3rem; }
.ob-chat .msg .qrm { display: grid; place-items: center; color: #0b3d1f; } .ob-chat .msg .qrm .ic { width: 100%; height: 100%; stroke-width: 1.6; }
.ob-panel:not(.green):not(.vault) .ob-foot::before { content: ""; position: absolute; left: 0; right: 0; top: -1.3rem; height: 1.3rem; background: linear-gradient(to bottom, transparent, var(--paper)); pointer-events: none; }
.ob-top { padding-left: max(1rem, calc((100% - 34rem) / 2)); padding-right: max(1rem, calc((100% - 34rem) / 2)); }
.ob-panel.vault .ob-input:disabled, .ob-panel.vault .ob-seg button:disabled { opacity: .55; }
.ob-form[data-off] { opacity: .85; }

.ob[data-chrome="s"] .ob-bar, .ob[data-chrome="s"] [data-back] { visibility: hidden; }

/* ===== v5: fundos vivos, partes novas das transições ===== */
.ob-panel::before { content: ""; position: absolute; inset: -10%; z-index: 0; pointer-events: none; background: radial-gradient(38% 30% at 88% 6%, var(--ob-a, color-mix(in srgb, #f2b632 24%, transparent)), transparent 70%), radial-gradient(40% 32% at 4% 46%, var(--ob-b, color-mix(in srgb, #3fb27a 20%, transparent)), transparent 70%); animation: obDrift 14s ease-in-out infinite alternate; }
@keyframes obDrift { to { transform: translate3d(-3%, 3%, 0) scale(1.08); } }
.ob-panel.green::before, .ob-panel.vault::before { background: radial-gradient(40% 30% at 50% 28%, rgba(255,226,130,.28), transparent 70%), radial-gradient(36% 28% at 90% 85%, rgba(255,255,255,.12), transparent 70%); }
.ob-panel[data-id="goal"] { --ob-a: color-mix(in srgb, #3b82f6 18%, transparent); --ob-b: color-mix(in srgb, #f2b632 22%, transparent); }
.ob-panel[data-id="income"] { --ob-a: color-mix(in srgb, #3fb27a 24%, transparent); --ob-b: color-mix(in srgb, #ec4899 14%, transparent); }
.ob-panel[data-id="budget"] { --ob-a: color-mix(in srgb, #f2b632 28%, transparent); --ob-b: color-mix(in srgb, #8b5cf6 14%, transparent); }
.ob-panel[data-id="save"] { --ob-a: color-mix(in srgb, #ec4899 16%, transparent); --ob-b: color-mix(in srgb, #3fb27a 24%, transparent); }
.ob-panel[data-id="charges"] { --ob-a: color-mix(in srgb, #25d366 22%, transparent); --ob-b: color-mix(in srgb, #f2b632 18%, transparent); }
.ob-panel[data-id="look"] { --ob-a: color-mix(in srgb, #8b5cf6 18%, transparent); --ob-b: color-mix(in srgb, #f2b632 22%, transparent); }
.ob-panel[data-id="tour"] { --ob-a: color-mix(in srgb, #14b8a6 20%, transparent); --ob-b: color-mix(in srgb, #f59e0b 20%, transparent); }
.ob-panel > * { position: relative; z-index: 1; }
.ob-panel > .ob-fx { position: absolute; z-index: 0; }
.ob-ov { position: absolute; pointer-events: none; }
.ob-grid { position: absolute; inset: 0; z-index: 6; pointer-events: none; overflow: hidden; }
.ob-grid i { position: absolute; transform: scale(0); will-change: transform; }

/* ==========================================================================
   CONFIG — ÚNICO lugar para ligar a conta/nuvem (opcional).
   Enquanto url e anonKey estiverem vazios, o app funciona 100% neste aparelho.

   Como ligar:
     1) Crie um projeto em supabase.com.
     2) No "SQL Editor", rode o SQL abaixo (cria a tabela com RLS: cada pessoa só enxerga a própria linha).
     3) Em Settings > API, copie "Project URL" e a chave "anon public" para cá.
        (A chave anon é pública por desenho. NUNCA use a service_role.)
     4) Em Authentication, deixe "Confirm email" ligado e coloque o endereço do app em "Site URL".

   --- SQL (rode uma vez) ---
   create table if not exists public.caderninho_data (
     user_id    uuid primary key references auth.users(id) on delete cascade,
     data       jsonb not null,
     version    integer not null default 1,
     updated_at timestamptz not null default now()
   );
   alter table public.caderninho_data enable row level security;
   create policy "le_propria_linha"   on public.caderninho_data for select using (auth.uid() = user_id);
   create policy "cria_propria_linha" on public.caderninho_data for insert with check (auth.uid() = user_id);
   create policy "muda_propria_linha" on public.caderninho_data for update using (auth.uid() = user_id) with check (auth.uid() = user_id);
   create policy "apaga_propria_linha" on public.caderninho_data for delete using (auth.uid() = user_id);
   --- fim do SQL ---
   ========================================================================== */

    return String(v == null ? '' : v)
      .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;')
      .replace(/"/g, '&quot;').replace(/'/g, '&#39;');
  }

  /* ---------- Datas (sempre "AAAA-MM-DD" no horário local) ---------- */
  function toISO(d) { return `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`; }
  function today() { return toISO(new Date()); }

  /** true se for uma data ISO real (rejeita 2026-02-30, 2026-13-01, "abc"...). */
  function isValidISO(s) {
    if (typeof s !== 'string' || !/^\d{4}-\d{2}-\d{2}$/.test(s)) return false;
    const [y, m, d] = s.split('-').map(Number);
    if (y < 1900 || y > 2200) return false;
    const dt = new Date(y, m - 1, d);
    return dt.getFullYear() === y && dt.getMonth() === m - 1 && dt.getDate() === d;

  function tryParse(raw) {

  function legacyScan() {
    try {
      const s = ls();

        if (!k || !/^caderninho/i.test(k) || k === KEY || k.startsWith(KEY) || k.startsWith(SNAP) || k.startsWith(CORRUPT) || k === SAFETY || /session|owner|install/i.test(k)) continue;

    } else {
      let found = null;
      if (rawMain) { try { safeSet(CORRUPT + Date.now(), rawMain); } catch (e) { /* ignore */ } }
      const prev = tryParse(safeGet(PREV));
      if (prev) found = { r: prev, label: 'a cópia anterior' };
      if (!found) for (const k of snapKeys()) { const r = tryParse(safeGet(k)); if (r) { found = { r, label: `a cópia de ${U.formatDate(k.slice(SNAP.length))}` }; break; } }

  /* ---------- Anotações ---------- */
  function checkMoney(v, label) {

  function addTransaction(d) {

    if (d.date > U.today()) throw new Error('A data não pode ser no futuro. Para o que vai vencer, use Contas.');
    const t = now();
    const tx = { id: U.uid(), type, amount, category: categoryInfo(type, d.category).id, note: str(d.note, 80), date: d.date, createdAt: t, updatedAt: t };
    if (d.billId) tx.billId = d.billId;
    if (d.goalId) tx.goalId = d.goalId;
    if (d.category === 'meta' && type === 'out') tx.category = 'meta';

    emit('transaction:added', tx);
    return tx;
  }
  function updateTransaction(id, d) {
    const tx = state.transactions.find((x) => x.id === id);
    if (!tx) throw new Error('Essa anotação não existe mais.');
    const type = d.type === 'in' ? 'in' : 'out';
    const amount = checkMoney(d.amount, 'um valor');
    if (!U.isValidISO(d.date)) throw new Error('Escolha uma data válida.');
    if (d.date > U.today()) throw new Error('A data não pode ser no futuro.');
    update((s) => {
      Object.assign(tx, { type, amount, category: categoryInfo(type, d.category).id, note: str(d.note, 80), date: d.date, updatedAt: now() });
    });
    return tx;
  }
  function deleteTransaction(id) {

    return tx;
  }
  function getTransaction(id) { return state.transactions.find((x) => x.id === id) || null; }
  const byDateDesc = (a, b) => (a.date < b.date ? 1 : a.date > b.date ? -1 : b.createdAt - a.createdAt);
  function recentTx(n) { return state.transactions.slice().sort(byDateDesc).slice(0, n); }
  function txInRange(from, to) { return state.transactions.filter((t) => t.date >= from && t.date <= to).sort(byDateDesc); }
  /** Entrou, Saiu (sem o que foi guardado em metas), Guardado e Sobrou. */
  function totals(list) {
    let inn = 0, out = 0, saved = 0;
    for (const t of list) {
      if (t.type === 'in') inn += t.amount;
      else if (t.category === 'meta') saved += t.amount;
      else out += t.amount;
    }
    return { in: inn, out, saved, net: inn - out - saved };
  }

  /* ---------- Contas ---------- */
  function cleanBillInput(d) {
    const kind = d.kind === 'receive' ? 'receive' : 'pay';
    const title = str(d.title, 50);
    if (!title) throw new Error(kind === 'pay' ? 'Dê um nome para a conta. Ex.: conta de luz.' : 'Diga o que você vendeu ou fez.');
    const amount = checkMoney(d.amount, 'o valor da conta');
    if (!U.isValidISO(d.dueDate)) throw new Error('Escolha uma data de vencimento válida.');
    let phone = '';
    if (kind === 'receive' && str(d.phone, 20)) {
      const n = U.normalizePhoneBR(d.phone);
      if (!n) throw new Error('Esse WhatsApp parece errado. Digite com DDD, por exemplo (81) 90000-0000.');
      phone = U.formatPhoneBR(d.phone);
