    return { kind, title, amount, dueDate: d.dueDate, recurring: !!d.recurring, person: kind === 'receive' ? str(d.person, 40) : '', phone };
  }
  function addBill(d) {
    const c = cleanBillInput(d);
    const t = now();

  }
  function updateBill(id, d) {
    const b = state.bills.find((x) => x.id === id);

  }

  function openBills() { return state.bills.filter((b) => b.status === 'open').sort((a, b) => (a.dueDate < b.dueDate ? -1 : a.dueDate > b.dueDate ? 1 : a.createdAt - b.createdAt)); }

    const b = getBill(id);

    const t = now();
    const date = U.today();
    const isRecv = b.kind === 'receive';
    const tx = { id: U.uid(), type: isRecv ? 'in' : 'out', amount: b.amount, category: isRecv ? 'vendas' : 'contas', note: str(b.title + (isRecv && b.person ? ' - ' + b.person : ''), 80), date, billId: b.id, createdAt: t, updatedAt: t };
    let next = null;
    const first = !b.xpAwarded;
    update((s) => {
      s.transactions.push(tx);

      if (b.recurring) {
        next = Object.assign({}, b, { id: U.uid(), dueDate: U.addMonths(b.dueDate, 1, b.recurDay), status: 'open', txid: 'CAD' + U.randomAlnum(12), createdAt: t, updatedAt: t });

  function deleteBill(id) {
    const b = getBill(id);

  /* ---------- Metas ---------- */
  function addGoal(d) {
    const title = str(d.title, 40);

    const t = now();
    const g = { id: U.uid(), title, target, saved: 0, createdAt: t, updatedAt: t };

  }

  function depositGoal(id, amount) {
    const g = getGoal(id);

    if (g.doneAt) throw new Error('Essa meta já foi batida.');
    const a = checkMoney(amount, 'um valor');
    const t = now();
    const tx = { id: U.uid(), type: 'out', amount: a, category: 'meta', note: str('Meta: ' + g.title, 80), date: U.today(), goalId: g.id, createdAt: t, updatedAt: t };

  /** Desfazer exclusão: devolve o registro e apaga a "lápide" para a sincronização não o remover de novo. */

    update((s) => {
      s.deleted = s.deleted.filter((d) => !(d.k === k && d.id === rec.id));

/* ===== 05-game.js ===== */
/* ==========================================================================
   Game — XP, níveis, sequência diária (streak) e conquistas.
   É a "marca" da Purytalent no app: finanças com cara de jogo.
   Para criar uma conquista nova, basta adicionar um item em ACHIEVEMENTS.

/* ==========================================================================
   UI — toast, bottom-sheet, confirmação e pequenos componentes de HTML
   ========================================================================== */
(function (global) {
  'use strict';

  const C = (global.Caderninho = global.Caderninho || {});
  const U = C.Utils;
  const esc = U.escapeHTML;
  const I = C.Icons.svg;

  /* ---------- Toast ---------- */
  function toast(msg, tone, opts) {
    opts = opts || {};
    let host = document.getElementById('toasts');
    if (!host) { host = document.createElement('div'); host.id = 'toasts'; host.className = 'toasts'; host.setAttribute('role', 'status'); host.setAttribute('aria-live', 'polite'); document.body.appendChild(host); }
    while (host.children.length >= 3) host.firstChild.remove();
    const el = document.createElement('div');
    el.className = 'toast ' + (tone || '');
    const span = document.createElement('span');
    span.textContent = msg;
    el.appendChild(span);
    if (opts.action) {
      const b = document.createElement('button');
      b.type = 'button'; b.textContent = opts.action.label;
      b.addEventListener('click', () => { try { opts.action.run(); } finally { el.remove(); } });
      el.appendChild(b);
    }
    host.appendChild(el);
    setTimeout(() => el.remove(), opts.action ? 7000 : (tone === 'error' ? 5000 : 3200));
  }

  /* ---------- Sheet (folha que sobe de baixo) ---------- */
  const stack = [];
  let skipPop = 0;

  function openSheet(o) {
    const overlay = document.createElement('div');
    overlay.className = 'overlay';
    overlay.innerHTML = `
      <div class="sheet" role="dialog" aria-modal="true" aria-label="${esc(o.titleText || String(o.title).replace(/<[^>]+>/g, ''))}">
        <div class="sheet-head"><h2>${o.title}</h2><button type="button" class="icon-btn" data-close aria-label="Fechar">${I('x')}</button></div>
        <div class="sheet-body">${o.html || ''}</div>
      </div>`;
    const sheet = { el: overlay, body: overlay.querySelector('.sheet-body'), closed: false, close };
    const opener = document.activeElement;
    function close(fromPop) {
      if (sheet.closed) return;
      sheet.closed = true;
      const i = stack.indexOf(sheet);
      if (i >= 0) stack.splice(i, 1);
      overlay.remove();
      if (!stack.length) document.body.classList.remove('sheet-open');
      if (!fromPop && global.history.state && global.history.state.cadSheet) { skipPop++; global.history.back(); }
      try { if (o.onClose) o.onClose(); } catch (e) { console.error(e); }
      try { if (opener && opener.focus && document.contains(opener)) opener.focus(); } catch (e) { /* ignore */ }
    }
    overlay.addEventListener('mousedown', (e) => { if (e.target === overlay) sheet.down = true; });
    overlay.addEventListener('click', (e) => { if (e.target === overlay && sheet.down && !o.persistent) close(); sheet.down = false; });
    overlay.querySelector('[data-close]').addEventListener('click', () => close());
    document.body.appendChild(overlay);
    document.body.classList.add('sheet-open');
    stack.push(sheet);
    try { global.history.pushState({ cadSheet: stack.length }, '', global.location.href); } catch (e) { /* ignore */ }
    C.Icons.hydrate(overlay);
    try { if (o.onMount) o.onMount(sheet.body, sheet); } catch (e) { console.error(e); toast('Algo deu errado ao abrir', 'error'); close(); return sheet; }
    const first = sheet.body.querySelector('input:not([type=checkbox]):not([readonly]), textarea:not([readonly])');
    // só foca o primeiro campo se a pessoa ainda não tocou em nenhum (senão rouba o foco no meio da digitação)
    if (first && !o.noFocus) setTimeout(() => { try { if (!sheet.closed && !sheet.body.contains(document.activeElement)) first.focus({ preventScroll: true }); } catch (e) { /* ignore */ } }, 60);
    return sheet;
  }
  global.addEventListener('popstate', () => {
    if (skipPop > 0) { skipPop--; return; }
    const top = stack[stack.length - 1];
    if (top) top.close(true);
  });
  document.addEventListener('keydown', (e) => {
    if (e.key !== 'Escape') return;
    const dlg = document.querySelector('.overlay.center');
    if (dlg) { dlg.dispatchEvent(new CustomEvent('cancel')); return; }
    const top = stack[stack.length - 1];
    if (top) top.close();
  });

  function confirmDialog(o) {
    return new Promise((resolve) => {
      const overlay = document.createElement('div');
      overlay.className = 'overlay center';
      overlay.innerHTML = `
        <div class="dialog" role="alertdialog" aria-modal="true" aria-label="${esc(o.title)}">
          <h2>${esc(o.title)}</h2>
          <p>${o.html ? o.message : esc(o.message)}</p>
          <div class="actions">
            <button type="button" class="btn ghost grow" data-no>${esc(o.cancelLabel || 'Cancelar')}</button>
            <button type="button" class="btn ${o.danger ? 'danger' : 'primary'} grow" data-yes>${esc(o.okLabel || 'OK')}</button>
          </div>
        </div>`;
      let done = false;
      const prevFocus = document.activeElement;
      const end = (v) => { if (done) return; done = true; overlay.remove(); try { prevFocus && prevFocus.focus && prevFocus.focus(); } catch (e) { /* ignore */ } resolve(v); };
      overlay.querySelector('[data-yes]').addEventListener('click', () => end(true));
      overlay.querySelector('[data-no]').addEventListener('click', () => end(false));
      overlay.addEventListener('cancel', () => end(false));
      overlay.addEventListener('mousedown', (e) => { if (e.target === overlay) end(false); });
      document.body.appendChild(overlay);
      overlay.querySelector(o.danger ? '[data-no]' : '[data-yes]').focus();
    });
  }

  /* ---------- Componentes de HTML ---------- */
  /** Cartãozinho de explicação. tone: info (azul) | tip (amarelo) | warn (vermelho) | ok (verde). force = aparece mesmo com explicações desligadas. */
  function help(html, o) {
    o = o || {};
    const tone = o.tone || 'info';
    const icon = o.icon || (tone === 'tip' ? 'bulb' : tone === 'warn' ? 'alert' : tone === 'ok' ? 'check-circle' : 'info');
    return `<div class="help ${tone}${o.force ? ' force' : ''}" role="note">${I(icon)}<div>${o.title ? `<span class="h-title">${esc(o.title)}</span>` : ''}${html}</div></div>`;
  }
  function progressBar(ratio, tone) {
    const r = U.clamp(Number.isFinite(ratio) ? ratio : 0, 0, 1);
    return `<div class="bar ${tone || ''}" role="progressbar" aria-valuemin="0" aria-valuemax="100" aria-valuenow="${Math.round(r * 100)}"><i style="width:${(r * 100).toFixed(1)}%"></i></div>`;
  }
  function emptyState(icon, title, text, extra) {
    return `<div class="empty">${I(icon)}<b>${esc(title)}</b><p>${esc(text)}</p>${extra || ''}</div>`;
  }
  /** Valor em dinheiro que pode ser escondido (modo "esconder valores"). */
  const money = (cents) => `<span class="money">${U.formatMoney(cents)}</span>`;

  function txRow(t) {
    const info = C.Store.categoryInfo(t.type, t.category);
    const isMeta = t.category === 'meta';
    const cls = t.type === 'in' ? 'in' : isMeta ? 'meta' : 'out';
    return `
      <button type="button" class="row" data-action="tx:edit" data-id="${esc(t.id)}" aria-label="${esc(t.note || info.label)}, ${U.formatMoney(t.amount)}">
        <span class="row-ico ${cls}" aria-hidden="true">${I(info.icon)}</span>
        <span class="row-main"><b>${esc(t.note || info.label)}</b><small>${esc(info.label)} · ${U.formatDate(t.date)}</small></span>
        <span class="amount ${cls}">${t.type === 'in' ? '+' : '-'}${money(t.amount)}</span>
      </button>`;
  }

  /** Campo de valor com máscara de banco: digita 1250 e vira 12,50. */
  function bindMoney(input) {
    const fmt = () => {
      const before = input.value;
      const v = U.maskMoney(before);
      if (v !== before) input.value = v;
    };
    input.addEventListener('input', fmt);
    input.addEventListener('focus', () => { setTimeout(() => { try { input.setSelectionRange(input.value.length, input.value.length); } catch (e) { /* ignore */ } }, 0); });
    fmt();
  }

  /** Baixa um arquivo gerado no aparelho. */
  function download(filename, text, mime) {
    const NB = global.CaderninhoNative;   // dentro do app Android: a casca grava em Downloads
    if (NB && typeof NB.saveFile === 'function') {
      let ok = false;
      try { ok = NB.saveFile(String(filename), String(mime || 'text/plain'), String(text)); } catch (e) { ok = false; }
      if (!ok) throw new Error('o aparelho não deixou gravar em Downloads');
      return;
    }
    const blob = new Blob([text], { type: mime || 'text/plain;charset=utf-8' });
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url; a.download = filename; a.rel = 'noopener';
    document.body.appendChild(a); a.click(); a.remove();
    setTimeout(() => URL.revokeObjectURL(url), 4000);
  }

  C.UI = { toast, openSheet, confirmDialog, help, progressBar, emptyState, txRow, money, bindMoney, download, closeAll: () => stack.slice().forEach((s) => s.close()) };
})(typeof window !== 'undefined' ? window : globalThis);

(function (global) {

  function openTransactionForm(opts) {

    const html = `

        <div class="seg" role="group" aria-label="Tipo de anotação">
          <button type="button" class="seg-btn" data-t="out">${I('minus')} Saída</button>

        </div>
        <label class="field"><span>Quanto foi?</span>
          <div class="money-input"><b>R$</b><input name="amount" inputmode="numeric" placeholder="0,00" aria-label="Valor em reais" value="${editing ? esc(U.centsToInput(editing.amount)) : ''}"></div>

        </div>

          if (!U.isValidISO(el.date.value)) return fieldError(el.date, 'Escolha uma data válida.');
          if (el.date.value > U.today()) return fieldError(el.date, 'A data não pode ser no futuro. Para o que vai vencer, use Contas.');
          const data = { type, amount, category, date: el.date.value, note: el.note.value };
          const ok = safely(() => {
            if (editing) { Store.updateTransaction(editing.id, data); UI.toast('Anotação alterada', 'success'); }
            else { Game.lastGain = 0; Store.addTransaction(data); UI.toast(Game.lastGain ? `Anotado! +${Game.lastGain} XP` : 'Anotado!', 'success'); }
            return true;
          });
          if (ok) sheet.close();
        });

        const del = body.querySelector('[data-del]');
        if (del) del.addEventListener('click', () => {
          const tx = Store.deleteTransaction(editing.id);
          sheet.close();
          if (tx) UI.toast('Anotação excluída', 'info', { action: { label: 'Desfazer', run: () => { Store.restore('tx', tx); UI.toast('Anotação de volta', 'success'); } } });
        });
      },
    });
  }

  /* ======================================================================
     Meu Pix (chave para receber)
     ====================================================================== */
  function openPixForm() {
    const cur = Store.get().profile.pix || {};
    let type = cur.type || 'cpf';
    UI.openSheet({
      title: 'Meu Pix',
      html: `
        <form class="form" autocomplete="off" novalidate>
          ${UI.help('Cadastre a chave em que você recebe. Nas contas <b>a receber</b>, o app cria o <b>Pix copia e cola</b> e o <b>QR Code</b> já com o valor certo. O nome e a cidade devem ser iguais aos do seu banco.', { title: 'Receber por Pix' })}
          ${UI.help('O app <b>não sabe</b> se o cliente pagou. Quando o dinheiro cair na sua conta, toque em <b>Recebi</b>. Confira sempre o nome que aparece no app do banco antes de confirmar.', { tone: 'warn', force: true })}
          <div class="field"><span>Tipo da chave</span><div class="chips" data-types></div></div>
          <label class="field"><span>Sua chave Pix</span>
            <input type="text" name="key" maxlength="80" autocapitalize="off" autocomplete="off" spellcheck="false" value="${esc(cur.key || '')}">
          </label>
          <label class="field"><span>Seu nome <em>(como aparece no banco, até 25 letras)</em></span>
            <input type="text" name="name" maxlength="40" placeholder="Ex.: Maria da Silva" value="${esc(cur.name || Store.get().profile.name || '')}">
          </label>
          <label class="field"><span>Sua cidade <em>(até 15 letras)</em></span>
            <input type="text" name="city" maxlength="30" placeholder="Ex.: Recife" value="${esc(cur.city || '')}">
          </label>
          <p class="hint" data-preview></p>
          <div class="actions">
            ${cur.key ? '<button type="button" class="btn danger-ghost" data-clear>Remover</button>' : ''}
            <button type="submit" class="btn primary grow">Salvar Pix</button>
          </div>
        </form>`,
      onMount(body, sheet) {
        const form = body.querySelector('form');
        const el = form.elements;
        const chips = body.querySelector('[data-types]');
        const preview = body.querySelector('[data-preview]');

        function updatePreview() {
          const n = C.Pix.clean(el.name.value, 25), c = C.Pix.clean(el.city.value, 15);
          const bits = [];
          if ((el.name.value.trim() && n !== el.name.value.trim()) || (el.city.value.trim() && c !== el.city.value.trim())) bits.push(`No QR Code vai aparecer: <b>${esc(n || '—')}</b> · <b>${esc(c || '—')}</b> (o padrão do Pix não aceita acentos).`);
          preview.innerHTML = bits.join(' ');
        }
        function paint() {
          const t = C.Pix.KEY_TYPES.find((x) => x.id === type);
          chips.innerHTML = C.Pix.KEY_TYPES.map((x) => `<button type="button" class="chip-b ${x.id === type ? 'active' : ''}" data-type="${x.id}" aria-pressed="${x.id === type}">${esc(x.label)}</button>`).join('');
          el.key.placeholder = t.placeholder;
          el.key.inputMode = type === 'email' ? 'email' : type === 'random' ? 'text' : 'numeric';
        }
        chips.addEventListener('click', (e) => { const b = e.target.closest('[data-type]'); if (b) { type = b.dataset.type; clearErrors(form); paint(); } });
        el.key.addEventListener('input', () => {
          const d = C.Pix.detectType(el.key.value);
          if (d && d !== type) { type = d; paint(); }
        });
        el.name.addEventListener('input', updatePreview); el.city.addEventListener('input', updatePreview);
        paint(); updatePreview();

        form.addEventListener('submit', (e) => {
          e.preventDefault();
          clearErrors(form);
          let key;
          try { key = C.Pix.validateKey(type, el.key.value); } catch (err) { return fieldError(el.key, err.message); }
          const name = el.name.value.trim();
          const city = el.city.value.trim();
          if (!C.Pix.clean(name, 25)) return fieldError(el.name, 'Digite o seu nome (letras e números).');
          if (!C.Pix.clean(city, 15)) return fieldError(el.city, 'Digite a sua cidade (letras e números).');
          // prova real: gera um código de teste e confere antes de salvar
          try {
            const test = C.Pix.build({ key, name, city, amountCents: 100, txid: 'TESTE' });
            const v = C.Pix.verify(test);
            if (!v.ok) throw new Error(v.errors[0]);
            C.QR.encode(test, 'M');
          } catch (err) { UI.toast('Não consegui gerar um Pix com esses dados: ' + err.message, 'error'); return; }
          Store.setProfile({ pix: { type, key, name, city } });
          Store.emit('pix:saved');
          UI.toast('Pix salvo! Toque em "Testar" no Perfil para ver o QR.', 'success');
          sheet.close();
        });

        const clear = body.querySelector('[data-clear]');
        if (clear) clear.addEventListener('click', async () => {
          const yes = await UI.confirmDialog({ title: 'Remover Pix?', message: 'As cobranças deixam de levar o Pix copia e cola.', okLabel: 'Remover', danger: true });
          if (!yes) return;
          Store.setProfile({ pix: null });
          UI.toast('Pix removido', 'info');
          sheet.close();
        });
      },
    });
  }

  function openAccountForm() {
    const Sync = C.Sync;
    if (!Sync || !Sync.isConfigured()) { UI.toast('A conta ainda não está disponível neste app', 'info'); return; }
    let mode = 'in';

    UI.openSheet({
      title: 'Minha conta',
      html: `
        <form class="form" autocomplete="on" novalidate>
          ${UI.help('Com uma conta, seus dados ficam guardados na nuvem e você usa o Caderninho em outros aparelhos. <b>O app continua funcionando sem internet</b>: o que você anotar é enviado quando a internet voltar.', { title: 'Para que serve' })}
          <div class="seg" role="group" aria-label="Entrar ou criar conta">
            <button type="button" class="seg-btn" data-m="in">Entrar</button>
            <button type="button" class="seg-btn" data-m="up">Criar conta</button>
          </div>
          <label class="field"><span>Seu e-mail</span>
            <input type="email" name="email" inputmode="email" autocomplete="username" autocapitalize="off" spellcheck="false" maxlength="120" placeholder="voce@exemplo.com">
          </label>
          <label class="field"><span>Senha <em data-pw-hint></em></span>
            <input type="password" name="password" autocomplete="current-password" maxlength="72">
          </label>
          <label class="check"><input type="checkbox" name="show"> Mostrar a senha</label>
          <p class="form-msg" data-msg role="alert" hidden></p>
          <div class="actions"><button type="submit" class="btn primary grow" data-submit>Entrar</button></div>
          <button type="button" class="link" data-forgot style="text-align:center">Esqueci minha senha</button>
        </form>`,
      onMount(body, sheet) {
        const form = body.querySelector('form');
        const el = form.elements;
        const msg = body.querySelector('[data-msg]');
        const submit = body.querySelector('[data-submit]');
        const forgot = body.querySelector('[data-forgot]');
        let busy = false;
        let lastPending = null;

        function say(text, tone) { msg.hidden = !text; msg.textContent = text || ''; msg.className = 'form-msg' + (tone ? ' ' + tone : ''); }
        function label() { submit.textContent = mode === 'in' ? 'Entrar' : 'Criar minha conta'; }
        function paint() {
          body.querySelectorAll('.seg-btn').forEach((b) => { const on = b.dataset.m === mode; b.classList.toggle('active', on); b.setAttribute('aria-pressed', String(on)); });
          label();
          el.password.autocomplete = mode === 'in' ? 'current-password' : 'new-password';
          body.querySelector('[data-pw-hint]').textContent = mode === 'up' ? '(mínimo 8 caracteres)' : '';
          forgot.hidden = mode !== 'in';
          say('');
        }
        function setBusy(on) { busy = on; submit.disabled = on; forgot.disabled = on; if (on) submit.textContent = 'Aguarde…'; else label(); }
        const cleanMail = (v) => String(v || '').trim().toLowerCase();

        body.querySelectorAll('.seg-btn').forEach((b) => b.addEventListener('click', () => { if (!busy) { mode = b.dataset.m; paint(); } }));
        el.show.addEventListener('change', () => { el.password.type = el.show.checked ? 'text' : 'password'; });
        paint();

        async function confirmSwitch(pending) {
          lastPending = pending;
          const yes = await UI.confirmDialog({
            title: 'Trocar de conta?',
            message: 'Este aparelho tem dados de outra conta. Para entrar nesta, esses dados serão removidos daqui (eles continuam salvos na outra conta). Deseja continuar?',
            okLabel: 'Trocar de conta', danger: true,
          });
          if (yes) return run(pending);
          return undefined;
        }
        async function run(pending) {
          setBusy(true); say('');
          try {
            if (pending) { await Sync.continueWith(pending); UI.toast('Conta conectada', 'success'); sheet.close(); }
            else if (mode === 'in') { await Sync.signIn(el.email.value, el.password.value); UI.toast('Conta conectada', 'success'); sheet.close(); }
            else {
              const r = await Sync.signUp(el.email.value, el.password.value);
              if (r.needsConfirm) { mode = 'in'; paint(); say('Enviamos um e-mail de confirmação. Abra o e-mail, toque no link e depois volte aqui para entrar.', 'ok'); }
              else { UI.toast('Conta criada e conectada', 'success'); sheet.close(); }
            }
          } catch (e) {
            if (e && e.code === 'other-account') { setBusy(false); return await confirmSwitch(e.pending); }
            say((e && e.message) || 'Não deu certo. Tente de novo.', 'bad');
          } finally { if (busy) setBusy(false); }
          return undefined;
        }
        form.addEventListener('submit', (e) => {
          e.preventDefault();
          if (busy) return;
          if (lastPending && cleanMail(el.email.value) === lastPending.user.email) confirmSwitch(lastPending); else run(null);
        });
        forgot.addEventListener('click', async () => {
          if (busy) return;
          setBusy(true); say('');
          try { await Sync.recover(el.email.value); say('Se esse e-mail tiver conta, você vai receber um link para criar uma nova senha.', 'ok'); }
          catch (e) { say((e && e.message) || 'Não deu certo. Tente de novo.', 'bad'); }
          finally { setBusy(false); }

/* ===== 10-views-a.js ===== */
/* ==========================================================================

(function (global) {

  function greeting() { const h = new Date().getHours(); return h < 12 ? 'Bom dia' : h < 18 ? 'Boa tarde' : 'Boa noite'; }

  function alertsCard(today) {

    return `

  function goalCard(s) {
    const g = s.goals.find((x) => !x.doneAt) || s.goals[0];

    }
    return `
      <section class="card">
        <div class="card-title"><h2>${I(g.doneAt ? 'trophy' : 'target')} ${esc(g.title)}</h2><a class="link" href="#/metas">Ver metas</a></div>
        ${UI.progressBar(g.saved / g.target, 'green')}
        <div class="goal-meta"><span>${$money(g.saved)}</span><span>de ${$money(g.target)}</span></div>
        ${UI.help('A barra mostra quanto da meta você já juntou. Em <b>Ver metas</b> você guarda mais dinheiro.')}
      </section>`;

  function budgetCard(s, spent) {

        <section class="card">

    return `
      <section class="card">
        <div class="card-title"><h2>${I('wallet')} Limite do mês</h2><button type="button" class="link" data-action="budget:edit">Mudar</button></div>

  function homeRender() {

          <button type="button" class="btn" data-action="tx:new" data-type="out">${I('minus')} Saiu</button>
        </div>
      </section>

      ${UI.help('<b>Sobrou</b> é tudo o que entrou menos o que saiu e o que você guardou em metas, neste mês. Toque em <b>Entrou</b> quando receber dinheiro e em <b>Saiu</b> quando gastar. O botão <b>+</b> faz o mesmo.', { title: 'Comece por aqui' })}

  const tl = { month: null, filter: 'all', q: '' };
  const TFILTERS = [{ id: 'all', label: 'Tudo' }, { id: 'in', label: 'Entradas' }, { id: 'out', label: 'Saídas' }, { id: 'meta', label: 'Guardado' }];

  function filtered() {
    const mk = tl.month || U.monthKey(U.today());

    const q = U.stripAccents(tl.q).toLowerCase().trim();

  }
  function listHTML() {
    const list = filtered();
    if (!list.length) {
      return `<section class="card">${UI.emptyState('notebook', tl.q || tl.filter !== 'all' ? 'Nada encontrado' : 'Nenhuma anotação neste mês', tl.q || tl.filter !== 'all' ? 'Tente outra palavra ou outro filtro.' : 'Toque no botão + para anotar o que entrou ou saiu.')}</section>`;

        ${UI.help('<b>Desfazer</b> devolve a conta para as abertas e remove a anotação criada ao dar baixa. <b>Excluir</b> apaga só a conta; a anotação do dinheiro continua.')}

  function chargeMessage(b) {
    const n = U.diffDays(U.today(), b.dueDate);
    const hi = b.person ? `Olá, ${U.firstName(b.person)}! Tudo bem?` : 'Olá! Tudo bem?';
    const base = `Passando para lembrar do pagamento de "${b.title}", no valor de ${U.formatMoney(b.amount)}`;
    if (n < 0) return `${hi} ${base}, que venceu no dia ${U.formatDate(b.dueDate)}. Consegue me confirmar quando puder pagar? Obrigado!`;

  function chargeText(b) {
    let msg = chargeMessage(b);
    let pix = null;
    try { pix = C.Pix.forBill(b, { qr: false }); } catch (e) { pix = null; }

    const url = `https://wa.me/${phone || ''}?text=${encodeURIComponent(text)}`;

    let w = null;
    try { w = global.open(url, '_blank'); } catch (e) { w = null; }
    if (w) { try { w.opener = null; } catch (e) { /* ignore */ } return true; }

        <div class="actions">

          <button type="button" class="btn wa grow" data-wa>${I('message')} WhatsApp</button>

      onMount(body, sheet) {
        const ta = body.querySelector('textarea');
        ta.addEventListener('focus', () => ta.select());
        body.querySelector('[data-copy]').addEventListener('click', async () => {
          const ok = await C.Pix.copyText(pix.code);
          if (!ok) { ta.focus(); ta.select(); }
          UI.toast(ok ? 'Código copiado' : 'Não consegui copiar. O código está selecionado: segure e toque em Copiar.', ok ? 'success' : 'error');

        body.querySelector('[data-wa]').addEventListener('click', () => { if (o.onWhatsApp) o.onWhatsApp(sheet); });
      },
    });
  }

  function needPixSheet() {
    UI.openSheet({
      title: 'Cobrar por Pix',
      html: `${UI.help('Para gerar o QR Code e o Pix copia e cola, cadastre primeiro a sua chave Pix, o nome e a cidade. É rápido e só precisa fazer uma vez.', { title: 'Falta a sua chave', force: true })}
        <div class="actions"><button type="button" class="btn primary grow" data-setup>${I('qr')} Cadastrar minha chave</button></div>`,
      onMount(body, sheet) { body.querySelector('[data-setup]').addEventListener('click', () => { sheet.close(); setTimeout(() => C.Forms.openPixForm(), 30); }); },
    });
  }

  C.Actions['pix:show'] = (el) => {

    let pix;

    if (!pix) { UI.toast('Esse Pix só funciona em contas a receber.', 'info'); return; }
    showPixSheet(pix, {
      amount: b.amount, subtitle: b.title + (b.person ? ' · ' + b.person : ''),

      title: 'Pix rápido',

        <form class="form" autocomplete="off" novalidate>

          <div class="actions"><button type="submit" class="btn primary grow">${I('qr')} Gerar Pix</button></div>
        </form>`,
      onMount(body, sheet) {
        const form = body.querySelector('form');
        UI.bindMoney(form.elements.amount);
        form.addEventListener('submit', (e) => {
          e.preventDefault();
          const amount = U.parseMoney(form.elements.amount.value);

          let pix;
          try { pix = C.Pix.quick({ amountCents: amount }); } catch (err) { UI.toast(err.message || 'Não consegui criar o Pix', 'error'); return; }
          sheet.close();
          setTimeout(() => showPixSheet(pix, {
            amount, subtitle: 'Pix rápido',
            onWhatsApp() { openWhatsApp('', `Segue o Pix de ${U.formatMoney(amount)}. Copie o código abaixo e cole no app do seu banco (Pix copia e cola):\n${pix.code}`); },
          }), 40);
        });
      },
    });
  };

  C.Actions['bill:charge'] = (el) => {
    const b = Store.getBill(el.dataset.id);
    if (!b) return;
    if (!b.phone) { UI.toast('Adicione o WhatsApp do cliente para cobrar', 'info'); C.Forms.openBillForm({ bill: b }); return; }
    const phone = U.normalizePhoneBR(b.phone);

    if (!openWhatsApp(phone, chargeText(b))) return;

  };

  C.Views.contas = { render: billsRender, chargeMessage, chargeText };
})(typeof window !== 'undefined' ? window : globalThis);

      okLabel: 'Apagar tudo', danger: true,

/* ===== 12-app.js ===== */
/* ==========================================================================
   App — roteador (hash), renderização, banners, tema, abertura e inicialização
   Nova tela: Caderninho.Views.minha = { render() { return '<html>'; } } e <a href="#/minha">.
   Nova ação: Caderninho.Actions['grupo:acao'] = (el, ev) => {...}  +  <button data-action="grupo:acao">
   ========================================================================== */
(function (global) {
  'use strict';

  const C = global.Caderninho;
  const U = C.Utils;
  const Store = C.Store;
  const Game = C.Game;
  const I = C.Icons.svg;
  const esc = U.escapeHTML;

  const TITLES = { home: 'Início', lancamentos: 'Anotações', contas: 'Contas', resumo: 'Resumo', metas: 'Metas', perfil: 'Perfil' };
  let lastRoute = null;
  let queued = false;
  let lastDay = U.today();
  const dismissed = new Set();

  function currentRoute() {
    const name = (global.location.hash || '').replace(/^#\/?/, '').split('?')[0];
    return Object.prototype.hasOwnProperty.call(C.Views, name) ? name : 'home';
  }

  /* ---------- Tema e preferências visuais ---------- */
  function applyPrefs() {
    const p = Store.get().profile;
    const root = document.documentElement;
    if (p.theme === 'light' || p.theme === 'dark') root.setAttribute('data-theme', p.theme); else root.removeAttribute('data-theme');
    document.body.classList.toggle('hide-values', !!p.hideValues);
    document.body.classList.toggle('no-help', !!p.hideHelp);
    const dark = p.theme === 'dark' || (p.theme !== 'light' && global.matchMedia && global.matchMedia('(prefers-color-scheme: dark)').matches);
    const m = document.querySelector('meta[name="theme-color"]');
    if (m) m.setAttribute('content', dark ? '#121a16' : '#1f7a4d');
  }

  /* ---------- Faixas de aviso (ficam no topo de todas as telas) ---------- */
  function banners() {
    const s = Store.get();
    const st = Store.status;
    const out = [];
    if (!st.ok && !dismissed.has('storage')) {
      out.push(`<div class="banner bad" role="alert">${I('alert')}<span><b>Seus dados não estão sendo guardados.</b> ${esc(st.error || '')} Salve uma cópia de segurança agora.</span><button type="button" class="btn small" data-action="data:export">Salvar</button></div>`);
    }
    if (st.recovered && !dismissed.has('recovered')) {
      const msg = st.recovered === 'none' ? 'Os dados salvos estavam danificados e não foi possível recuperar. Se você tem uma conta, entre nela para recuperar seus dados.' : `Os dados estavam danificados e foram recuperados de ${esc(st.recovered)}.`;
      out.push(`<div class="banner warn" role="status">${I('shield')}<span>${msg}</span><button type="button" class="btn small" data-action="banner:dismiss" data-b="recovered">Ok</button></div>`);
    }
    if (st.dropped > 0 && !dismissed.has('dropped')) {
      out.push(`<div class="banner warn" role="status">${I('alert')}<span>${st.dropped} item(ns) com defeito foram ignorados ao abrir. O arquivo original foi guardado por segurança.</span><button type="button" class="btn small" data-action="banner:dismiss" data-b="dropped">Ok</button></div>`);
    }
    const n = s.transactions.length;
    const cloud = C.Sync && C.Sync.isConfigured() ? C.Sync.status() : null;
    if (cloud && !cloud.loggedIn && st.ok && n >= 5 && !dismissed.has('account') && currentRoute() !== 'perfil') {
      out.push(`<div class="banner ok" role="status">${I('cloud')}<span><b>Crie sua conta</b> e seus dados ficam guardados na nuvem, mesmo se você trocar de celular.</span><button type="button" class="btn small primary" data-action="account:open">Criar</button><button type="button" class="icon-btn" data-action="banner:dismiss" data-b="account" aria-label="Fechar">${I('x')}</button></div>`);
    }
    if (st.ok && !(cloud && (cloud.loggedIn || !dismissed.has('account') && n >= 5)) && false && n >= 10 && !dismissed.has('backup') && Date.now() - (s.profile.lastBackupAt || 0) > 14 * 86400000 && currentRoute() !== 'perfil') {
      out.push(`<div class="banner ok" role="status">${I('download')}<span>${s.profile.lastBackupAt ? 'Faz tempo que você não salva uma cópia.' : 'Você ainda não salvou uma cópia de segurança.'}</span><button type="button" class="btn small primary" data-action="data:export">Salvar</button><button type="button" class="icon-btn" style="width:2.2rem;height:2.2rem" data-action="banner:dismiss" data-b="backup" aria-label="Dispensar">${I('x')}</button></div>`);
    }
    return out.join('');
  }
  C.Actions['banner:dismiss'] = (el) => { dismissed.add(el.dataset.b); C.App.render(); };

  /* ---------- Cabeçalho ---------- */
  function paintChrome(route) {
    const s = Store.get();
    document.querySelectorAll('.tabbar a[data-route]').forEach((a) => {
      const on = a.dataset.route === route;
      a.classList.toggle('active', on);
      if (on) a.setAttribute('aria-current', 'page'); else a.removeAttribute('aria-current');
    });
    const st = Game.streak(s);
    const chip = document.getElementById('streakChip');
    if (chip) { chip.innerHTML = `${I(st.count > 0 ? 'flame' : 'sprout')} <b>${st.count}</b>`; chip.classList.toggle('off', st.count === 0); chip.setAttribute('aria-label', `${st.count} dias seguidos`); }
    const av = document.getElementById('avatar');
    if (av) { if (s.profile.name && s.profile.name.trim()) av.textContent = s.profile.name.trim().charAt(0).toUpperCase(); else av.innerHTML = I('user'); }
    paintNet();
    document.title = `${TITLES[route] || 'Caderninho'} · Caderninho`;
  }
  function paintNet() {
    const el = document.getElementById('netChip');
    if (!el) return;
    const online = global.navigator.onLine !== false;
    const sync = C.Sync && C.Sync.isConfigured() ? C.Sync.status() : null;
    let html = '', cls = '';
    if (!online) { html = I('wifi-off') + '<span>Sem internet</span>'; cls = 'off'; }
    else if (sync && sync.loggedIn && sync.busy) { html = I('refresh') + '<span>Sincronizando</span>'; cls = 'busy'; }
    else if (sync && sync.loggedIn && sync.error) { html = I('alert') + '<span>Erro ao sincronizar</span>'; cls = 'err'; }
    el.hidden = !html;
    el.className = 'chip-net ' + cls;
    el.innerHTML = html;
  }

  /** Redesenha a tela atual. Várias chamadas seguidas viram um único redesenho (microtask, não rAF: o rAF congela em segundo plano). */
  function render() {
    if (queued) return;
    queued = true;
    Promise.resolve().then(() => {
      queued = false;
      const route = currentRoute();
      const main = document.getElementById('view');
      const active = document.activeElement;
      const keepScroll = route === lastRoute ? global.scrollY : 0;
      let html;
      try { html = C.Views[route].render(); } catch (e) {
        console.error(e);
        html = `<section class="card">${C.UI.emptyState('alert', 'Não consegui abrir esta tela', 'Seus dados estão seguros. Toque para tentar de novo.', '<button type="button" class="btn primary" onclick="location.reload()">Recarregar</button>')}</section>`;
      }
      applyPrefs();
      const prevRoute = lastRoute;
      if (C.Shell) { try { C.Shell.before(main, route, prevRoute); } catch (e) { console.error(e); } }
      main.innerHTML = banners() + html;
      main.dataset.route = route;
      paintChrome(route);
      C.Icons.hydrate(main);
      if (route !== lastRoute) { global.scrollTo(0, 0); lastRoute = route; } else if (keepScroll) global.scrollTo(0, keepScroll);
      if (C.Shell) { try { C.Shell.after(main, route, !!prevRoute && route !== prevRoute, !prevRoute); } catch (e) { console.error(e); } }
      if (active && active.id === 'txSearch') { const n = document.getElementById('txSearch'); if (n) { n.focus(); try { n.setSelectionRange(n.value.length, n.value.length); } catch (e) { /* ignore */ } } }
      const fab = document.getElementById('fab');
      if (fab) fab.hidden = route === 'perfil';
    });
  }

  function bindEvents() {
    document.addEventListener('click', (e) => {
      const el = e.target.closest('[data-action]');
      if (!el || el.disabled) return;
      const fn = C.Actions[el.dataset.action];
      if (fn) {
        e.preventDefault();
        try { const r = fn(el, e); if (r && r.catch) r.catch(onError); } catch (err) { onError(err); }
      }
    });
    document.addEventListener('change', (e) => {
      const el = e.target.closest('[data-change]');
      if (!el) return;
      const fn = C.Actions[el.dataset.change];
      if (fn) { try { const r = fn(el, e); if (r && r.catch) r.catch(onError); } catch (err) { onError(err); } }
    });
    global.addEventListener('hashchange', () => { C.UI.closeAll(); render(); });
    document.addEventListener('visibilitychange', () => { if (!document.hidden) { checkDay(); render(); } });
    global.addEventListener('online', () => { paintNet(); });
    global.addEventListener('offline', () => { paintNet(); });
    global.addEventListener('beforeinstallprompt', (e) => { e.preventDefault(); global.__cadInstall = e; render(); });
    global.addEventListener('appinstalled', () => { global.__cadInstall = null; render(); });
    Store.subscribe(render);
    Store.on('storage:error', () => { C.UI.toast('Não consegui guardar os dados neste aparelho!', 'error'); render(); });
    if (C.Sync) { let wasIn = C.Sync.isLoggedIn(); C.Sync.onChange(() => { paintNet(); const now = C.Sync.isLoggedIn(); if (currentRoute() === 'perfil' || now !== wasIn) { wasIn = now; render(); } }); }
    setInterval(checkDay, 60000);
    global.addEventListener('error', (e) => { console.error(e.error || e.message); });
    global.addEventListener('unhandledrejection', (e) => { console.error(e.reason); });
  }
  let lastErr = 0;
  function onError(err) {
    console.error(err);
    if (Date.now() - lastErr < 1500) return;
    lastErr = Date.now();
    C.UI.toast((err && err.message) || 'Algo deu errado. Tente de novo.', 'error');
  }
  /** Se o app ficou aberto de um dia para o outro, atualiza (sequência, "hoje", vencimentos). */
  function checkDay() { const d = U.today(); if (d !== lastDay) { lastDay = d; render(); } }

  /* ---------- Som de abertura ("tim") ---------- */
  let audioCtx = null, timPlayed = false;
  function playTim(force) {
    if (timPlayed) return;
    const st = Store.get();
    if (st && st.profile && st.profile.muteSound) { timPlayed = true; return; }
    try {
      const AC = global.AudioContext || global.webkitAudioContext;
      if (!AC) return;
      audioCtx = audioCtx || new AC();
      const ctx = audioCtx;
      const ring = () => {
        if (timPlayed || ctx.state !== 'running') return;
        timPlayed = true;
        const t0 = ctx.currentTime + 0.02;
        const master = ctx.createGain(); master.gain.value = 0.06;
        const soft = ctx.createBiquadFilter(); soft.type = 'lowpass'; soft.frequency.value = 3200;
        master.connect(soft); soft.connect(ctx.destination);
        [[1046.5, 0], [1568, 0.12]].forEach(([freq, delay]) => {
          [[1, 1, 1.0], [2, 0.25, 0.6]].forEach(([mult, vol, dur]) => {
            const osc = ctx.createOscillator(); const g = ctx.createGain(); const t = t0 + delay;
            osc.type = 'sine'; osc.frequency.value = freq * mult;
            g.gain.setValueAtTime(0.0001, t); g.gain.exponentialRampToValueAtTime(vol, t + 0.025); g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
            osc.connect(g); g.connect(master); osc.start(t); osc.stop(t + dur + 0.05);

  }

  /** Animação de abertura (~3s). Toque para pular. Resolve a Promise quando termina. */
  function runSplash() {
    const el = document.getElementById('splash');

    const reduce = !!(global.matchMedia && global.matchMedia('(prefers-reduced-motion: reduce)').matches);

      let over = false;
      function finish() {

        over = true;
        el.classList.add('leave');
        setTimeout(() => { el.remove(); resolve(); }, 600);
      }
      el.addEventListener('pointerdown', () => playTim(true));
      const known = !!(Store.get() && Store.get().profile && Store.get().profile.welcomed);
      if (!reduce) setTimeout(() => playTim(false), 1500);
      setTimeout(finish, reduce ? 1200 : (known ? 2700 : 3500));
    });
  }

  /* ---------- Manifesto (instalar na tela inicial) sem arquivo separado ---------- */
  function installManifest() {
    try {
      const icon = (document.querySelector('link[rel="icon"]') || {}).href;

        start_url: global.location.href.split('#')[0], display: 'standalone', background_color: '#1f7a4d', theme_color: '#1f7a4d', lang: 'pt-BR',
        icons: [{ src: icon, sizes: '192x192', type: 'image/png', purpose: 'any' }],

      link.href = URL.createObjectURL(new Blob([JSON.stringify(m)], { type: 'application/manifest+json' }));
      document.head.appendChild(link);
    } catch (e) { /* opcional */ }
  }

  function init() {
    const splash = runSplash();
    Store.load();
    Game.init();
    Game.evaluate({ silent: true });
    applyPrefs();
    bindEvents();
    installManifest();
    render();
    if (C.Sync) C.Sync.init();
    // a boas-vindas só abre depois da animação (senão o teclado aparece por baixo dela)
    if (!Store.get().profile.welcomed) splash.then(() => { if (!Store.get().profile.welcomed) { if (C.Onboarding) C.Onboarding.start(); else C.Forms.openNameForm({ welcome: true }); } });
  }

  C.App = { init, render, currentRoute, playTim };
  if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', init); else init();
})(typeof window !== 'undefined' ? window : globalThis);

   API:  Caderninho.Art.tim({mood,pose,hat,cls,track})   → <svg> do mascote

    const overduePay = open.filter((b) => b.kind === 'pay' && U.diffDays(today, b.dueDate) < 0);
    const overdueRecv = open.filter((b) => b.kind === 'receive' && U.diffDays(today, b.dueDate) < 0);
    const soonPay = open.filter((b) => b.kind === 'pay' && U.diffDays(today, b.dueDate) >= 0 && U.diffDays(today, b.dueDate) <= 3);
    const soonRecv = open.filter((b) => b.kind === 'receive' && U.diffDays(today, b.dueDate) >= 0 && U.diffDays(today, b.dueDate) <= 2);
    const st = Game.streak(s);
    const budget = s.profile.budget || 0;
    const ratio = budget ? ctx.t.out / budget : 0;
    const emptyAll = s.transactions.length === 0 && s.bills.length === 0;
    const when = (b) => { const n = U.diffDays(today, b.dueDate); return n < -1 ? `venceu há ${-n} dias` : n === -1 ? 'venceu ontem' : n === 0 ? 'vence hoje' : n === 1 ? 'vence amanhã' : `vence em ${n} dias`; };

    if (emptyAll) return { key: 'first', tone: 'go', scene: 'notebook', mood: 'wave', tag: 'Passo 1', title: 'Vamos começar? Anote o primeiro ganho ou gasto', text: 'Toque no botão e digite o valor. É rapidinho, e já ganha seus primeiros pontos.', cta: { label: 'Fazer minha 1ª anotação', a: act('tx:new', 'data-type="out"') }, alt: { label: 'Ver com dados de exemplo', a: act('demo:load') } };
    if (overduePay.length) {
      const b = overduePay[0];
      return overduePay.length === 1
        ? { key: 'overdue', tone: 'bad', scene: 'bills', mood: 'sad', tag: 'Atenção', title: `${esc(b.title)} ${when(b)}`, text: `São ${U.formatMoney(b.amount)}. Pagando hoje, você evita juros e sustos.`, cta: { label: 'Já paguei', a: act('bill:settle', `data-id="${esc(b.id)}"`) }, alt: { label: 'Abrir a conta', a: act('bill:open', `data-id="${esc(b.id)}"`) } }
        : { key: 'overdue', tone: 'bad', scene: 'bills', mood: 'sad', tag: 'Atenção', title: `${overduePay.length} contas atrasadas`, text: `Somam ${U.formatMoney(U.sum(overduePay, (x) => x.amount))}. Vamos resolver uma por uma?`, cta: { label: 'Ver contas atrasadas', href: '#/contas' } };
    }
    if (soonPay.length) {
      const b = soonPay[0];
      return { key: 'soon', tone: 'warn', scene: 'bills', mood: 'think', tag: 'Vem aí', title: `${esc(b.title)} ${when(b)}`, text: soonPay.length > 1 ? `Mais ${soonPay.length - 1} ${plural(soonPay.length - 1, 'conta vence', 'contas vencem')} nos próximos dias.` : `Valor: ${U.formatMoney(b.amount)}. Já pagou? Dê baixa e ganhe XP.`, cta: { label: 'Já paguei', a: act('bill:settle', `data-id="${esc(b.id)}"`) }, alt: { label: 'Ver todas as contas', href: '#/contas' } };
    }
    if (overdueRecv.length || soonRecv.length) {
      const b = (overdueRecv.length ? overdueRecv : soonRecv)[0];
      return { key: 'charge', tone: 'warn', scene: 'pix', mood: 'wink', tag: 'Dinheiro a receber', title: `${esc(b.person || b.title)} ${overdueRecv.length ? 'ainda não pagou' : 'deve pagar logo'}`, text: `${esc(b.title)}: ${U.formatMoney(b.amount)} (${when(b)}). Mande a cobrança com Pix pelo WhatsApp.`, cta: { label: 'Cobrar no WhatsApp', a: act('bill:charge', `data-id="${esc(b.id)}"`) }, alt: { label: 'Mostrar o Pix', a: act('pix:show', `data-id="${esc(b.id)}"`) } };
    }
    if (budget && ratio >= 0.8) {
      const left = budget - ctx.t.out;
      return { key: 'budget', tone: ratio >= 1 ? 'bad' : 'warn', scene: 'chart', mood: ratio >= 1 ? 'sad' : 'think', tag: 'Limite do mês', title: ratio >= 1 ? 'Você passou do limite do mês' : `Você já usou ${Math.round(ratio * 100)}% do limite`, text: ratio >= 1 ? `Passou ${U.formatMoney(-left)}. Veja onde dá para cortar.` : `Restam só ${U.formatMoney(left)} até o fim do mês.`, cta: { label: 'Ver onde gastei', href: '#/resumo' } };
    }
    if (!st.loggedToday) {
      return { key: 'log', tone: 'go', scene: 'notebook', mood: 'wave', tag: st.atRisk ? `Sequência de ${st.count} ${plural(st.count, 'dia', 'dias')} em risco` : 'Hoje', title: st.atRisk ? 'Anote algo hoje para não perder a sequência' : `Já anotou o que rolou hoje${name ? ', ' + name : ''}?`, text: 'Registrar na hora é o segredo para o dinheiro não sumir. Dois toques e pronto.', cta: { label: 'Anotar o que saiu', a: act('tx:new', 'data-type="out"') }, alt: { label: 'Entrou dinheiro', a: act('tx:new', 'data-type="in"') } };
    }
    if (s.goals.length === 0) return { key: 'goal', tone: 'go', scene: 'piggy', mood: 'wink', tag: 'Sonhe alto', title: 'Crie sua primeira meta', text: 'Guardar um pouquinho todo mês muda a vida. Escolha um sonho e dê um valor para ele.', cta: { label: 'Criar uma meta', a: act('goal:new') } };
    if (!budget) return { key: 'budget0', tone: 'go', scene: 'chart', mood: 'think', tag: 'Controle', title: 'Defina quanto pode gastar por mês', text: 'Com um limite, eu aviso quando você estiver chegando perto.', cta: { label: 'Definir limite', a: act('budget:edit') } };
    if (!s.profile.pix) return { key: 'pix', tone: 'go', scene: 'pix', mood: 'wink', tag: 'Receba mais fácil', title: 'Cadastre sua chave Pix', text: 'Assim você cobra clientes com QR Code e “copia e cola” em segundos.', cta: { label: 'Cadastrar Pix', a: act('pix:settings') } };
    const g = s.goals.find((x) => !x.doneAt);
    if (g) return { key: 'save', tone: 'go', scene: 'piggy', mood: 'happy', tag: 'Meta em andamento', title: `Guarde um pouquinho em “${esc(g.title)}”`, text: `Você já juntou ${U.formatMoney(g.saved)} de ${U.formatMoney(g.target)}. Cada real conta!`, cta: { label: 'Guardar dinheiro', a: act('goal:deposit', `data-id="${esc(g.id)}"`) }, alt: { label: 'Ver minhas metas', href: '#/metas' } };
    return { key: 'ok', tone: 'go', scene: 'trophy', mood: 'party', tag: 'Tudo certo', title: 'Tudo em dia por aqui!', text: 'Contas ok, anotações em dia e metas batidas. Que tal ver o resumo do mês?', cta: { label: 'Ver meu resumo', href: '#/resumo' } };
  }

  function helloLine(nba, ctx) {
    const nm = ctx.name ? `, ${ctx.name}` : '';
    const g = greeting();
    if (nba.key === 'first') return `<b>Oi${nm}!</b> Eu sou o Tim, seu caderninho. Siga o card verde: eu te levo passo a passo.`;
    if (nba.key === 'overdue') return `<b>${g}${nm}.</b> Tem conta atrasada pedindo atenção. Vamos resolver juntos?`;
    if (nba.key === 'soon') return `<b>${g}${nm}!</b> Tem conta vencendo logo. Olha o que eu separei:`;
    if (nba.key === 'charge') return `<b>${g}${nm}!</b> Tem dinheiro para você receber. Bora cobrar?`;
    if (nba.key === 'budget') return `<b>${g}${nm}.</b> Fique de olho no limite do mês.`;
    if (nba.key === 'log') return `<b>${g}${nm}!</b> A coisa mais importante hoje:`;
    if (nba.key === 'ok') return `<b>${g}${nm}!</b> Tá tudo em ordem. Orgulho de você!`;
    return `<b>${g}${nm}!</b> Separei o próximo passo para você:`;
  }

  function nbaCard(nba) {
    const cta = nba.cta.href ? `<a class="nba-cta" href="${nba.cta.href}">${nba.cta.label}${I('chevron-right')}</a>` : `<button type="button" class="nba-cta" ${nba.cta.a}>${nba.cta.label}${I('chevron-right')}</button>`;
    const alt = nba.alt ? (nba.alt.href ? `<a class="nba-alt" href="${nba.alt.href}">${nba.alt.label}</a>` : `<button type="button" class="nba-alt" ${nba.alt.a}>${nba.alt.label}</button>`) : '';
    return `<section class="nba ${nba.tone}" aria-label="O que fazer agora" data-nba="${nba.key}">
      <div class="nba-art" aria-hidden="true">${Art.scene(nba.scene)}</div>
      <div class="nba-body">
        <span class="nba-tag">${I('zap')}${esc(nba.tag)}</span>
        <h2>${nba.title}</h2>
        <p>${nba.text}</p>
        <div class="nba-act">${cta}${alt}</div>
      </div>
    </section>`;
  }

  function balanceCard(s, t, mk, today, opts) {
    opts = opts || {};
    // evolução do saldo dia a dia (mini gráfico)
    let spark = '';
    if (opts.spark !== false) {
      const day = Number(today.slice(8));
      const byDay = new Array(day + 1).fill(0);
      Store.txInRange(`${mk}-01`, today).forEach((x) => { const d = Number(x.date.slice(8)); if (d <= day) byDay[d] += x.type === 'in' ? x.amount : -x.amount; });
      let acc = 0; const vals = [0];
      for (let d = 1; d <= day; d++) { acc += byDay[d]; vals.push(acc); }
      if (vals.some((v) => v !== 0) && day >= 2) spark = `<div class="hero-spark">${Art.spark(vals, { h: 40 })}</div>`;
    }
    return `<section class="card balance hero" aria-label="Saldo do mês">
      <svg class="hero-deco" viewBox="0 0 200 120" aria-hidden="true"><circle cx="170" cy="20" r="56" fill="#fff" opacity=".07"/><circle cx="196" cy="86" r="30" fill="#fff" opacity=".06"/><g opacity=".22" transform="translate(132 14) rotate(14)"><circle r="14" fill="none" stroke="#fff" stroke-width="3"/><text y="6" text-anchor="middle" font-family="system-ui,Arial" font-weight="900" font-size="17" fill="#fff">$</text></g><g opacity=".14" transform="translate(176 96) rotate(-10)"><circle r="10" fill="none" stroke="#fff" stroke-width="3"/></g></svg>
      <p class="eyebrow"><span>${opts.label || 'Sobrou em ' + U.monthName(mk)}</span>
        ${opts.noEye ? '' : `<button type="button" class="eye-btn" data-action="pref:hide" aria-label="${s.profile.hideValues ? 'Mostrar valores' : 'Esconder valores'}" aria-pressed="${!!s.profile.hideValues}">${I(s.profile.hideValues ? 'eye-off' : 'eye')}</button>`}
      </p>
      <p class="big cu ${t.net < 0 ? 'neg' : ''}">${$m(t.net)}</p>
      ${spark}
      <div class="split">
        <div class="in"><span class="dot">${I('trending-up')}</span><span class="sp-t"><small>Entrou</small><b>${$m(t.in)}</b></span></div>
        <div class="out"><span class="dot">${I('trending-down')}</span><span class="sp-t"><small>Saiu</small><b>${$m(t.out)}</b></span></div>
      </div>
      ${t.saved > 0 ? `<p class="saved-note">${I('target')} Guardado em metas: ${$m(t.saved)}</p>` : ''}
      ${opts.extra || ''}
    </section>`;
  }

  function quickTiles() {
    const T = (cls, icon, label, a) => `<button type="button" class="qt ${cls}" ${a}><span class="qt-ic">${I(icon)}</span><span class="qt-l">${label}</span></button>`;
    return `<div class="quick-tiles" role="group" aria-label="Atalhos">
      ${T('in', 'plus', 'Entrou', act('tx:new', 'data-type="in"'))}
      ${T('out', 'minus', 'Saiu', act('tx:new', 'data-type="out"'))}
      ${T('bill', 'receipt', 'Conta', act('bill:new', 'data-kind="pay"'))}
      ${T('pix', 'qr', 'Pix', act('pix:quick'))}
    </div>`;
  }

  function stepsCard(s, steps) {
    const done = steps.filter((x) => x.done).length;
    return `<section class="card steps" aria-label="Primeiros passos">
      <div class="steps-head">${Art.ring(done / steps.length, { size: 64, stroke: 8, color: 'var(--gold)', cls: 'sm', center: `<b>${done}/${steps.length}</b>` })}
        <div><h2>Primeiros passos</h2><p class="hint">Cumpra um por um para deixar o app do seu jeito.</p></div></div>
      <div class="list">${steps.map((x) => `<button type="button" class="step ${x.done ? 'done' : ''}" ${x.done ? 'disabled' : x.a}>
        <span class="st-ck">${x.done ? I('check') : I(x.icon)}</span>
        <span class="row-main"><b>${x.title}</b><small>${x.done ? 'Feito!' : x.sub}</small></span>
        ${x.done ? '' : I('chevron-right', 'go')}
      </button>`).join('')}</div>
    </section>`;
  }

  function journeyCard(s) {
    const st = Game.streak(s);
    const lvl = Game.levelFor(s.game.xp);
    const days = new Set(s.game.days || []);
    const today = U.today();
    const wk = [];
    for (let i = 6; i >= 0; i--) { const iso = U.addDays(today, -i); const d = U.parseISO(iso); wk.push({ iso, on: days.has(iso), now: i === 0, l: 'DSTQQSS'[d.getDay()] }); }
    const nextAch = Game.ACHIEVEMENTS.find((a) => !s.game.achievements[a.id]);
    return `<section class="card journey" aria-label="Seu progresso">
      <div class="j-top">
        ${Art.levelBadge(lvl.level, { cls: 'j-badge' })}
        <div class="j-info"><b>Nível ${lvl.level} · ${esc(lvl.title)}</b><small>${lvl.into} de ${lvl.span} XP para o nível ${lvl.level + 1}</small>${UI.progressBar(lvl.progress)}</div>
      </div>
      <div class="week" role="img" aria-label="Dias em que você anotou na última semana">
        ${wk.map((d) => `<span class="wd ${d.on ? 'on' : ''} ${d.now ? 'now' : ''}"><i>${d.on ? I('flame') : ''}</i><small>${d.l}</small></span>`).join('')}
      </div>
      <p class="j-msg">${st.loggedToday ? `${I('check-circle')} Sequência garantida hoje: <b>${st.count} ${plural(st.count, 'dia', 'dias')}</b>.` : st.atRisk ? `${I('alert')} Anote algo hoje para manter seus <b>${st.count} ${plural(st.count, 'dia', 'dias')}</b>.` : `${I('sprout')} Anote hoje para começar uma sequência.`}</p>
      ${nextAch ? `<p class="j-next">${I('trophy')}<span>Próxima conquista: <b>${esc(nextAch.title)}</b> · ${esc(nextAch.desc)}</span></p>` : ''}
    </section>`;
  }

  function billsStrip(open, today) {
    const list = open.slice(0, 8);
    if (!list.length) return '';
    return `<section aria-label="Próximas contas">
      ${sectionHead('calendar', 'Próximas contas', '<a class="link" href="#/contas">Ver todas</a>')}
      <div class="strip">${list.map((b) => {
        const n = U.diffDays(today, b.dueDate), recv = b.kind === 'receive';
        const tone = n < 0 ? 'bad' : n <= 3 ? 'warn' : 'ok';
        const lbl = n < -1 ? `${-n} dias de atraso` : n === -1 ? 'Venceu ontem' : n === 0 ? 'Vence hoje' : n === 1 ? 'Amanhã' : `Em ${n} dias`;
        return `<article class="bcard ${tone}">
          <button type="button" class="bc-top" data-action="bill:open" data-id="${esc(b.id)}" aria-label="Abrir ${esc(b.title)}">
            <span class="row-ico cat" style="--cat:${recv ? '#16a34a' : n < 0 ? '#ef4444' : '#3b82f6'}">${I(recv ? 'banknote' : 'receipt')}</span>
            <span class="badge ${tone}">${lbl}</span>
          </button>
          <b class="bc-t">${esc(b.title)}</b>
          <span class="bc-a ${recv ? 'pos' : ''}">${recv ? '+' : ''}${UI.money(b.amount)}</span>
          <button type="button" class="btn primary small block" data-action="bill:settle" data-id="${esc(b.id)}">${I('check')} ${recv ? 'Recebi' : 'Paguei'}</button>
        </article>`;
      }).join('')}</div>
    </section>`;
  }

  function budgetGoal(s, spent) {
    const b = s.profile.budget || 0;
    let c1;
    if (!b) {
      c1 = `<article class="card mini"><div class="mini-top"><span class="mini-ic">${I('wallet')}</span><b>Limite do mês</b></div><p class="hint">Defina quanto pode gastar e eu aviso quando chegar perto.</p><button type="button" class="btn ghost small block" ${act('budget:edit')}>Definir limite</button></article>`;
    } else {
      const r = spent / b, left = b - spent;
      const col = r >= 1 ? 'var(--red)' : r >= 0.8 ? 'var(--gold)' : 'var(--green)';
      c1 = `<article class="card mini"><div class="mini-top"><span class="mini-ic">${I('wallet')}</span><b>Limite do mês</b></div>
        <div class="mini-ring">${Art.ring(r, { size: 84, stroke: 10, color: col, center: `<b>${Math.round(r * 100)}%</b>` })}</div>
        <p class="hint ${r >= 1 ? 'neg' : ''}"><b>${left >= 0 ? 'Pode gastar ' + U.formatMoney(left) : 'Passou ' + U.formatMoney(-left)}</b></p>
        <button type="button" class="link" ${act('budget:edit')}>Mudar limite</button></article>`;
    }
    const g = s.goals.find((x) => !x.doneAt);
    let c2;
    if (!g) {
      c2 = `<article class="card mini"><div class="mini-top"><span class="mini-ic gold">${I('target')}</span><b>Metas</b></div><p class="hint">Sonhar com número ajuda a juntar. Crie sua primeira meta!</p><button type="button" class="btn ghost small block" ${act('goal:new')}>Criar meta</button></article>`;
    } else {
      const r = g.saved / g.target;
      c2 = `<article class="card mini"><div class="mini-top"><span class="mini-ic gold">${I('target')}</span><b>${esc(g.title)}</b></div>
        <div class="mini-ring">${Art.ring(r, { size: 84, stroke: 10, color: 'var(--gold)', center: `<b>${Math.floor(r * 100)}%</b>` })}</div>
        <p class="hint"><b>Faltam ${U.formatMoney(Math.max(0, g.target - g.saved))}</b></p>
        <button type="button" class="btn primary small block" ${act('goal:deposit', `data-id="${esc(g.id)}"`)}>${I('plus')} Guardar</button></article>`;
    }
    return `<div class="two-cards">${c1}${c2}</div>`;
  }

  function lostCard() {
    return `<section class="card lost" aria-label="Ajuda">
      <div class="lost-t">${Art.tim({ mood: 'think', pose: 'think', cls: 't-float', feet: false })}<div><h2>Ainda perdido?</h2><p class="hint">Eu explico cada tela em 1 minuto.</p></div></div>
      <div class="lost-b"><button type="button" class="btn primary small grow" ${act('v2:help')}>${I('bulb')} O que cada tela faz</button><button type="button" class="btn ghost small grow" ${act('onb:replay')}>${I('refresh')} Rever o passeio</button></div>
    </section>`;
  }

  function homeRender() {
    const s = Store.get();
    const today = U.today();
    const mk = U.monthKey(today);
    const range = U.monthRange(mk);
    const t = Store.totals(Store.txInRange(range.from, range.to));
    const name = s.profile.name ? esc(U.firstName(s.profile.name)) : '';
    const open = Store.openBills();
    const ctx = { today, open, name, t };
    const nba = nextAction(s, ctx);
    const steps = setup(s);
    const stepsDone = steps.every((x) => x.done);
    const recent = Store.recentTx(5);
    const hello = `<section class="hello" aria-label="Saudação">
      <div class="hello-tim">${Art.tim({ mood: nba.mood === 'wave' ? 'happy' : nba.mood, pose: nba.mood === 'wave' ? 'wave' : nba.mood === 'think' ? 'think' : nba.mood === 'party' ? 'cheer' : 'rest', cls: nba.mood === 'sad' ? 't-sway' : 't-float', hat: nba.mood === 'party' ? 'party' : undefined })}</div>
      <div class="hello-b">${helloLine(nba, ctx)}</div>
    </section>`;
    return `${hello}
      ${nbaCard(nba)}
      ${balanceCard(s, t, mk, today)}
      ${quickTiles()}
      ${stepsDone ? journeyCard(s) : stepsCard(s, steps)}
      ${billsStrip(open, today)}
      ${budgetGoal(s, t.out)}
      ${recent.length ? `<section class="card" aria-label="Últimas anotações">${sectionHead('book', 'Últimas anotações', '<a class="link" href="#/lancamentos">Ver tudo</a>')}<div class="list">${recent.map((x) => txRow(x)).join('')}</div></section>` : ''}
      ${stepsDone ? '' : journeyCard(s)}
      ${lostCard()}`;
  }
  C.Views.home = { render: homeRender };

  /* ---------- Ajuda: "O que cada tela faz" ---------- */
  C.Actions['v2:help'] = () => {
    const R = (href, icon, color, t, d) => `<a class="help-row" href="${href}"><span class="row-ico cat" style="--cat:${color}">${I(icon)}</span><span class="row-main"><b>${t}</b><small class="wrap">${d}</small></span>${I('chevron-right', 'go')}</a>`;
    UI.openSheet({
      title: 'O que cada tela faz',
      html: `<div class="help-tim">${Art.tim({ mood: 'happy', pose: 'wave', cls: 't-float', feet: false })}<p>Eu sou o <b>Tim</b>. Toque numa tela para ir até ela:</p></div>
        <div class="help-list">
          ${R('#/home', 'home', '#1f7a4d', 'Início', 'O que fazer agora, saldo do mês e atalhos.')}
          ${R('#/lancamentos', 'notebook', '#3b82f6', 'Anotações', 'Tudo que entrou e saiu, dia a dia.')}
          ${R('#/contas', 'receipt', '#ef4444', 'Contas', 'O que você vai pagar e o que vão te pagar. Cobre por Pix.')}
          ${R('#/resumo', 'chart', '#8b5cf6', 'Resumo', 'Gráficos: para onde foi o seu dinheiro.')}
          ${R('#/metas', 'target', '#f59e0b', 'Metas', 'Cofrinhos para os seus sonhos.')}
        </div>
        ${UI.help('O botão <b>+</b> dourado, no canto, abre o menu para anotar uma entrada, uma saída, uma conta ou um Pix de qualquer tela.', { tone: 'tip', force: true })}`,
    });
  };

  /* ======================================================================
     ANOTAÇÕES
     ====================================================================== */
  const tl = { month: null, filter: 'all', q: '' };
  const TFILTERS = [{ id: 'all', label: 'Tudo' }, { id: 'in', label: 'Entradas' }, { id: 'out', label: 'Saídas' }, { id: 'meta', label: 'Guardado' }];
  const matchF = (t, f) => (f === 'all') || (f === 'in' && t.type === 'in') || (f === 'out' && t.type === 'out' && t.category !== 'meta') || (f === 'meta' && t.category === 'meta');
  function txFiltered(list) {
    const q = U.stripAccents(tl.q).toLowerCase().trim();
    return list.filter((t) => matchF(t, tl.filter) && (!q || U.stripAccents(t.note + ' ' + Store.categoryInfo(t.type, t.category).label).toLowerCase().includes(q)));
  }
  function txListHTML(all) {
    const list = txFiltered(all);
    if (!list.length) {
      const filt = tl.q || tl.filter !== 'all';

      ${helpbox('Para que serve esta tela', '<b>A pagar</b> são as suas contas, como luz, aluguel e internet. <b>A receber</b> é dinheiro que alguém ainda vai te pagar. Quando pagar ou receber, toque no botão verde para dar baixa (e ganhar XP). Em contas a receber, <b>Cobrar</b> abre o WhatsApp com a mensagem pronta. Contas <b>todo mês</b> voltam sozinhas.')}`;

  function summaryRender() {

    const list = Store.txInRange(r.from, r.to);
    const t = Store.totals(list);
    const prevKey = U.shiftMonth(mk, -1);
    const pr = U.monthRange(prevKey);
    const upTo = mk === nowKey ? Math.min(Number(U.today().slice(8)), Number(pr.to.slice(8))) : Number(pr.to.slice(8));
    const pt = Store.totals(Store.txInRange(pr.from, `${prevKey}-${U.pad(upTo)}`));
    const months = [];
    for (let i = -5; i <= 0; i++) { const k = U.shiftMonth(mk, i); const rr = U.monthRange(k); months.push({ k, t: Store.totals(Store.txInRange(rr.from, rr.to)) }); }
    const maxV = Math.max(1, ...months.map((m) => Math.max(m.t.in, m.t.out)));

    const catList = Array.from(cats.entries()).map(([id, v]) => ({ id, v, info: Store.categoryInfo('out', id), color: Art.catColor(id, 'out') })).sort((a, b) => b.v - a.v);

  let dir = 1;

      a.onfinish = () => g.remove();
      setTimeout(() => g.remove(), 600);
    } catch (e) { /* sem transição, tudo bem */ }
  }

  function countUp(root) {
    root.querySelectorAll('.cu .money[data-c]').forEach((el) => {
      const to = Number(el.dataset.c);
      if (!Number.isFinite(to) || to === 0) return;
      const t0 = performance.now(), dur = Math.min(1100, 500 + Math.log10(Math.abs(to) + 10) * 90);
      const ease = (x) => 1 - Math.pow(1 - x, 4);
      el.textContent = U.formatMoney(0);
      const step = (now) => {
        const k = Math.min(1, (now - t0) / dur);
        el.textContent = U.formatMoney(Math.round(to * ease(k)));
        if (k < 1 && el.isConnected) global.requestAnimationFrame(step); else el.textContent = U.formatMoney(to);
      };
      global.requestAnimationFrame(step);
    });
  }

  function enter(main, swapping, first) {
    if (reduced()) return;
    if (swapping) main.animate([{ opacity: 0, transform: `translateX(${dir * 36}px) scale(.985)` }, { opacity: 1, transform: 'none' }], { duration: 440, easing: SPRING });
    const kids = Array.from(main.children).filter((n) => !n.classList.contains('banner'));
    kids.slice(0, 14).forEach((el, i) => {
      el.animate([{ opacity: 0, transform: 'translateY(18px) scale(.985)' }, { opacity: 1, transform: 'none' }], { duration: 520, delay: (first ? 120 : 60) + i * 55, easing: SPRING, fill: 'backwards' });
    });

    if (strip) Array.from(strip.children).forEach((el, i) => el.animate([{ opacity: 0, transform: 'translateX(40px)' }, { opacity: 1, transform: 'none' }], { duration: 480, delay: 320 + i * 70, easing: SPRING, fill: 'backwards' }));
    main.querySelectorAll('.nba-art, .hello-tim').forEach((el) => el.animate([{ opacity: 0, transform: 'scale(.6) rotate(-8deg)' }, { opacity: 1, transform: 'none' }], { duration: 620, delay: 260, easing: SPRING, fill: 'backwards' }));
    main.querySelectorAll('.sparkline .sl, .spark .sl').forEach((p) => { p.style.strokeDasharray = '100'; p.animate([{ strokeDashoffset: 100 }, { strokeDashoffset: 0 }], { duration: 1100, delay: 300, easing: 'ease-out', fill: 'backwards' }); });
  }

  function after(main, route, swapping, first) {
    const fresh = swapping || first;
    Art.animateIn(main, fresh);
    if (fresh) { countUp(main); enter(main, swapping, first); }
    paintTabs(route);
    paintAvatar();
    closeDial(true);

  /* ---------- Barra de abas com indicador deslizante ---------- */

  }

  function paintAvatar() {

    { icon: 'trending-up', label: 'Entrou dinheiro', cls: 'in', a: 'tx:new', d: 'data-type="in"' },
    { icon: 'receipt', label: 'Conta a pagar', cls: 'bill', a: 'bill:new', d: 'data-kind="pay"' },
    { icon: 'message', label: 'Cobrar um cliente', cls: 'wa', a: 'bill:new', d: 'data-kind="receive"' },
    { icon: 'qr', label: 'Pix rápido', cls: 'pix', a: 'pix:quick', d: '' },
  ];

  function buildDial() {
    if (dial) return dial;
    dial = doc.createElement('div');
    dial.className = 'dial'; dial.id = 'dial'; dial.hidden = true;
    dial.innerHTML = `<button type="button" class="dial-scrim" aria-label="Fechar menu" tabindex="-1"></button>
      <div class="dial-items" role="menu" aria-label="O que você quer anotar?">${ITEMS.map((it) => `<button type="button" role="menuitem" class="dial-item ${it.cls}" data-action="${it.a}" ${it.d}><span class="di-l">${it.label}</span><span class="di-ic">${I(it.icon)}</span></button>`).join('')}</div>`;
    doc.body.appendChild(dial);
    dial.addEventListener('click', (e) => { if (e.target.closest('.dial-scrim') || e.target.closest('.dial-item')) closeDial(); });

  }
  function openDial() {

    items.forEach((el, i) => el.animate([{ opacity: 0, transform: 'translateY(26px) scale(.7)' }, { opacity: 1, transform: 'none' }], { duration: 420, delay: i * 45, easing: SPRING, fill: 'backwards' }));

    items.forEach((el, i) => el.animate([{ opacity: 1, transform: 'none' }, { opacity: 0, transform: 'translateY(18px) scale(.8)' }], { duration: 200, delay: i * 25, easing: 'ease-in', fill: 'forwards' }));
    const sc = d.querySelector('.dial-scrim').animate([{ opacity: 1 }, { opacity: 0 }], { duration: 240, fill: 'forwards' });

  /* ---------- "Puxar para fechar" nas folhas (sheets) ---------- */
  function sheetDrag() {
    let st = null;
    doc.addEventListener('pointerdown', (e) => {
      const head = e.target.closest && e.target.closest('.sheet-head');
      if (!head || e.target.closest('[data-close]')) return;
      const sheet = head.closest('.sheet'); if (!sheet) return;
      st = { sheet, y0: e.clientY, t0: performance.now(), dy: 0, id: e.pointerId };

    doc.addEventListener('pointermove', (e) => {
      if (!st || e.pointerId !== st.id) return;

      if (!st || (e && e.pointerId !== st.id)) return;
      const { sheet, dy, t0 } = st; st = null;
      const v = dy / Math.max(1, performance.now() - t0);

        const btn = sheet.querySelector('[data-close]');
        sheet.style.transition = 'transform .22s ease-in'; sheet.style.transform = 'translateY(110%)';
        setTimeout(() => { if (btn) btn.click(); }, 200);

    doc.addEventListener('pointerup', end); doc.addEventListener('pointercancel', end);
  }

  /* ---------- Início ---------- */

    const fab = doc.getElementById('fab');

      fab.removeAttribute('data-action'); fab.removeAttribute('data-type');

    }
    doc.addEventListener('keydown', (e) => { if (e.key === 'Escape' && open) closeDial(); });
    global.addEventListener('hashchange', () => closeDial(true));
    global.addEventListener('scroll', onScroll, { passive: true });
    doc.addEventListener('click', (e) => {
      const tab = e.target.closest && e.target.closest('.tabbar a.tab');
      if (tab) vib(6);
      const b = e.target.closest && e.target.closest('.btn.primary, .nba-cta, .qt');
      if (b) vib(8);
    }, true);
    sheetDrag(); onScroll();
  }
  if (doc.readyState === 'loading') doc.addEventListener('DOMContentLoaded', init); else init();

  C.Shell = { before, after, openDial, closeDial, paintTabs, paintAvatar, countUp };
})(typeof window !== 'undefined' ? window : globalThis);

      bill: { id: 'bill', title: 'Cadastre uma conta que vai vencer', sub: 'Eu lembro de você no dia' },

  /* ---------- Tema ao vivo (círculo que se abre onde você tocou) ---------- */
  function setThemePreview(theme, ev) {
    const rootEl = doc.documentElement;
    const apply = () => { if (theme === 'light' || theme === 'dark') rootEl.setAttribute('data-theme', theme); else rootEl.removeAttribute('data-theme'); };
    if (doc.startViewTransition && !reduced()) {
      const x = ev && ev.clientX ? ev.clientX : global.innerWidth / 2, y = ev && ev.clientY ? ev.clientY : global.innerHeight / 2;
      const r = Math.hypot(Math.max(x, global.innerWidth - x), Math.max(y, global.innerHeight - y));
      try {
        const vt = doc.startViewTransition(apply);
        vt.ready.then(() => rootEl.animate({ clipPath: [`circle(0px at ${x}px ${y}px)`, `circle(${r}px at ${x}px ${y}px)`] }, { duration: 650, easing: 'ease-in-out', pseudoElement: '::view-transition-new(root)' })).catch(() => {});
        return;
      } catch (e) { /* cai no simples */ }
    }
    apply();
  }

  /* ---------- Transições (uma diferente por tela) ---------- */
  const EASE = 'cubic-bezier(.2,.9,.25,1)', SPRING = 'cubic-bezier(.2,1.25,.4,1)', INOUT = 'cubic-bezier(.65,0,.25,1)';
  const an = (el, kf, o) => el.animate(kf, Object.assign({ duration: 520, easing: EASE, fill: 'both' }, o || {}));
  const ov = (cls, css) => { const e = doc.createElement('div'); e.className = 'ob-ov ' + (cls || ''); if (css) e.style.cssText = css; stage.appendChild(e); return e; };
  // troca de tela escondida atrás de um "pano" (persiana, mosaico, moeda)
  const swap = (o, n, T, r) => [
    an(o, [{ opacity: 1, offset: 0 }, { opacity: 1, offset: r }, { opacity: 0, offset: Math.min(0.999, r + 0.01) }, { opacity: 0, offset: 1 }], { duration: T, easing: 'linear' }),
    an(n, [{ opacity: 0, offset: 0 }, { opacity: 0, offset: r }, { opacity: 1, offset: Math.min(0.999, r + 0.01) }, { opacity: 1, offset: 1 }], { duration: T, easing: 'linear' }),
  ];
  function rings(x, y, n, gold) {
    const out = [];
    for (let i = 0; i < n; i++) {
      const r = ov('ob-ring' + (gold ? ' gold' : ''), `left:${x}px;top:${y}px`);

  }

      t.style.cssText = `left:${(c * tw - 0.5).toFixed(1)}px;top:${(r * th - 0.5).toFixed(1)}px;width:${(tw + 1).toFixed(1)}px;height:${(th + 1).toFixed(1)}px;background:${colors[(r + c) % 2]}`;

    for (let r = 0; r < rows; r++) {

      c.innerHTML = '<b>$</b>';

        { transform: `${base} scale(0) rotateY(0deg)`, opacity: 1, offset: 0, easing: 'cubic-bezier(.2,1.3,.4,1)' },
        { transform: `${base} scale(1) rotateY(360deg)`, opacity: 1, offset: 0.3, easing: 'ease-in-out' },
        { transform: `${base} scale(1.2) rotateY(720deg)`, opacity: 1, offset: 0.43, easing: 'cubic-bezier(.6,0,.9,.6)' },

    },
    // portas do cofre se abrindo
    doors: (o) => {
      const L = o.cloneNode(true), R = o.cloneNode(true), sl = ov('ob-slit'), dur = 1000, ease = 'cubic-bezier(.65,0,.25,1)';

        an(n, [{ transform: 'scale(1.18)', filter: 'brightness(1.5) blur(4px)' }, { transform: 'none', filter: 'none' }], { duration: dur + 160, easing: 'cubic-bezier(.3,.8,.3,1)' }),
        an(sl, [{ opacity: 0, transform: 'scaleX(.2)' }, { opacity: 1, transform: 'scaleX(1)', offset: 0.18 }, { opacity: 0, transform: 'scaleX(6)' }], { duration: dur + 160 })];
    },
    // persianas
    blinds: (o, n) => strips(o, n, 8, ['#1f7a4d', '#2e9a64']),

    // explosão de comemoração

      return [an(n, [{ transform: 'scale(.5)', opacity: 0 }, { transform: 'none', opacity: 1 }], { easing: SPRING, duration: 760 }), o && an(o, [{ transform: 'none', opacity: 1 }, { transform: 'scale(1.35)', opacity: 0 }], { duration: 380 })].concat(rings(x, y, 3, true));
    },
    flip: (o, n, d) => [an(n, [{ transform: `rotateY(${-90 * d}deg)`, opacity: 0.4 }, { transform: 'none', opacity: 1 }], { duration: 480, delay: 230, easing: SPRING }), o && an(o, [{ transform: 'none', opacity: 1 }, { transform: `rotateY(${90 * d}deg)`, opacity: 0 }], { duration: 300, easing: 'ease-in' })],
    rotate: (o, n, d) => [an(n, [{ transform: `rotate(${-14 * d}deg) translateY(45%) scale(.8)`, opacity: 0 }, { transform: 'none', opacity: 1 }], { duration: 640, easing: SPRING }), o && an(o, [{ transform: 'none', opacity: 1 }, { transform: `rotate(${14 * d}deg) translateY(-35%) scale(.8)`, opacity: 0 }], { duration: 420 })],
  };
  const BASE = { flip: 420, coin: 780, blinds: 760, mosaic: 760, doors: 640, iris: 420, cube: 480, pageturn: 480, burst: 320, rise: 300 };

    flip: [{ opacity: 0, transform: 'rotateX(-80deg) translateY(.5rem)' }, { opacity: 1, transform: 'none' }],

  function stagger(p, base) {

  }

(function () {
  try {

    if (low || /[?&]lite=1/.test(location.search)) document.documentElement.classList.add('lite');
  } catch (e) { /* ok */ }
})();

(function () {
  'use strict';
  var C = window.Caderninho; if (!C) return;
  var cur = window.__CAD_VERSION || '0';
  var base = location.protocol === 'https:' ? location.origin + location.pathname.replace(/[^\/]*$/, '') : null; // pasta do app
  var last = 0, shown = false;
  function num(v) { return String(v).split('.').map(function (x) { return +x || 0; }); }

      .then(function (h) { var m = h && /const VERSION = '([\d.]+)'/.exec(h); return m ? m[1] : null; })
      .catch(function () { return null; });
  }
  function apply() { location.replace(base + 'index.html?v=' + Date.now()); }

    if (shown) return; shown = true;
    var d = document.createElement('div'); d.className = 'upd-snack'; d.setAttribute('role', 'status');
    d.innerHTML = '<span>Nova versão <b></b> pronta.</span><button type="button" class="btn small primary">Atualizar</button><button type="button" class="upd-x" aria-label="Fechar">×</button>';
    d.querySelector('b').textContent = 'v' + v;
    d.querySelector('.primary').addEventListener('click', apply);
    d.querySelector('.upd-x').addEventListener('click', function () { d.remove(); });
    document.body.appendChild(d);
  }
  function check(manual) {
    return latest().then(function (v) {
      last = Date.now();
      if (v && newer(v, cur)) { snack(v); if (manual) C.UI.toast('Nova versão v' + v + ' disponível. Toque em Atualizar.', 'info'); }
      else if (manual) C.UI.toast(v ? 'Você já está na versão mais nova (v' + cur + ').' : 'Não consegui verificar agora. Confira a internet.', v ? 'success' : 'info');
    });
  }
  C.Actions['app:checkupdate'] = function () { check(true); };
  setTimeout(function () { check(false); }, 5000);
  document.addEventListener('visibilitychange', function () { if (!document.hidden && Date.now() - last > 5 * 60000) check(false); });
})();
